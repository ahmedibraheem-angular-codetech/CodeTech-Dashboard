<p-dialog
  [header]="title()"
  [visible]="visible()"
  (visibleChange)="onVisible($event)"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: 'min(28rem, 94vw)' }"
>
  <p>{{ message() }}</p>
  <ng-template #footer>
    <p-button
      [label]="cancelLabel()"
      severity="secondary"
      variant="outlined"
      (onClick)="cancel()"
    />
    <p-button
      [label]="confirmLabel()"
      [severity]="danger() ? 'danger' : null"
      (onClick)="confirm()"
    />
  </ng-template>
</p-dialog>
