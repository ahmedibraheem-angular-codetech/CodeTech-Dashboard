<div class="locale-switch" role="group" dir="ltr">
  <button
    type="button"
    class="locale-switch__option"
    [class.is-active]="value() === 'en'"
    [attr.aria-pressed]="value() === 'en'"
    (click)="picked.emit('en')"
  >
    <span>English</span>
    <img src="images/flag-gb.svg" alt="" />
    @if (invalid().includes('en')) {
      <i class="pi pi-exclamation-circle locale-switch__error" role="img" aria-label="Error"></i>
    }
  </button>
  <button
    type="button"
    class="locale-switch__option"
    [class.is-active]="value() === 'ar'"
    [attr.aria-pressed]="value() === 'ar'"
    (click)="picked.emit('ar')"
  >
    <span>عربي</span>
    <img src="images/flag-sa.png" alt="" />
    @if (invalid().includes('ar')) {
      <i class="pi pi-exclamation-circle locale-switch__error" role="img" aria-label="خطأ"></i>
    }
  </button>
</div>
