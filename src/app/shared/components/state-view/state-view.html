<div class="state" [attr.role]="mode() === 'loading' ? 'status' : 'alert'">
  @switch (mode()) {
    @case ('loading') {
      <p-progress-spinner
        styleClass="state__spinner"
        strokeWidth="4"
        [ariaLabel]="message() || lang.t('common.loading')"
      />
      <p>{{ message() || lang.t('common.loading') }}</p>
    }
    @case ('empty') {
      <i class="pi pi-inbox" aria-hidden="true"></i>
      <p>{{ message() || lang.t('common.empty') }}</p>
    }
    @case ('error') {
      <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
      <p>{{ message() || lang.t('common.error') }}</p>
      <p-button
        [label]="lang.t('users.retry')"
        severity="secondary"
        variant="outlined"
        (onClick)="retry.emit()"
      />
    }
  }
</div>
