<p-dialog
  styleClass="app-modal"
  [visible]="visible()"
  (visibleChange)="!$event && requestClose()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="false"
  [closable]="dismissible() && closeOnCancel()"
  [closeOnEscape]="dismissible() && closeOnCancel()"
  [closeAriaLabel]="lang.t('common.close')"
>
  <ng-template #header let-labelledBy="ariaLabelledBy">
    <div class="app-modal__heading">
      @if (iconUrl(); as url) {
        <span class="app-modal__icon"><img [src]="url" alt="" /></span>
      } @else if (icon(); as iconClass) {
        <span class="app-modal__icon"><i [class]="iconClass" aria-hidden="true"></i></span>
      }
      <span class="app-modal__title" [id]="labelledBy">{{ title() }}</span>
    </div>
  </ng-template>

  <ng-content />

  <ng-template #footer>
    @if (showSave()) {
      <app-button
        class="app-modal__action"
        [icon]="saveIcon() || undefined"
        [label]="saveLabel() ?? lang.t('common.saveChanges')"
        [fluid]="true"
        [loading]="saving()"
        [disabled]="saveDisabled()"
        (clicked)="onSave()"
      />
    }
    @if (showCancel()) {
      <app-button
        class="app-modal__action"
        variant="outlined"
        [label]="cancelLabel() ?? lang.t('common.cancel')"
        [fluid]="true"
        [disabled]="saving()"
        (clicked)="requestClose()"
      />
    }
  </ng-template>
</p-dialog>
