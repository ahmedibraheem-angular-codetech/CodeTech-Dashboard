<p-tabs [value]="value()" (valueChange)="valueChange.emit($event)" scrollable>
  <p-tablist>
    @for (tab of tabs(); track tab.id) {
      <p-tab [value]="tab.id">
        <i [class]="tab.icon" aria-hidden="true"></i>
        <span>{{ lang.t(tab.labelKey) }}</span>
      </p-tab>
    }
  </p-tablist>
</p-tabs>
