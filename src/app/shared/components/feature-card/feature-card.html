<article class="feature-card">
  <header class="feature-card__tab">
    <span>{{ label() }}</span>
    <button
      type="button"
      class="feature-card__remove"
      [disabled]="removeDisabled()"
      [attr.aria-label]="removeLabel()"
      (click)="removed.emit()"
    >
      <i class="pi pi-trash" aria-hidden="true"></i>
    </button>
  </header>
  <div class="feature-card__body">
    <label class="field">
      <span class="field__label">{{ titleLabel() }}</span>
      <input
        pInputText
        [fluid]="true"
        [value]="title()"
        [placeholder]="titlePlaceholder()"
        (input)="titleChange.emit($event)"
      />
    </label>
    <label class="field">
      <span class="field__label">{{ bodyLabel() }}</span>
      <textarea
        pTextarea
        [fluid]="true"
        rows="3"
        [value]="body()"
        [placeholder]="bodyPlaceholder()"
        (input)="bodyChange.emit($event)"
      ></textarea>
    </label>
    <div class="field">
      <span class="field__label">{{ iconLabel() }}</span>
      <app-product-upload
        [locale]="locale()"
        [actions]="true"
        [name]="imageName()"
        [url]="imageUrl()"
        (picked)="imageChange.emit($event)"
      />
    </div>
  </div>
</article>
