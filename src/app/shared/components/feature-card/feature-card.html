<article class="feature-card" [class.is-active]="active()">
  <header class="feature-card__tab" (click)="selected.emit()">
    <span>{{ label() }}</span>
    <button
      type="button"
      class="feature-card__remove"
      [disabled]="removeDisabled()"
      [attr.aria-label]="removeLabel()"
      (click)="removed.emit(); $event.stopPropagation()"
    >
      <i [class]="'pi ' + removeIcon()" aria-hidden="true"></i>
    </button>
  </header>
  <div class="feature-card__body">
    <label class="field">
      <span class="field__label">{{ titleLabel() }}</span>
      <input
        pInputText
        [fluid]="true"
        [value]="title()"
        [placeholder]="titlePlaceholder()"
        (input)="titleChange.emit($event)"
      />
      @if (titleIcon()) {
        <i class="field__mark" [class]="'pi ' + titleIcon()" aria-hidden="true"></i>
      }
    </label>
    <label class="field">
      <span class="field__label">{{ bodyLabel() }}</span>
      <textarea
        pTextarea
        [fluid]="true"
        rows="3"
        [value]="body()"
        [placeholder]="bodyPlaceholder()"
        (input)="bodyChange.emit($event)"
      ></textarea>
    </label>
    @if (showIcon()) {
      <div class="field">
        <span class="field__label">{{ iconLabel() }}</span>
        <app-product-upload
          [locale]="locale()"
          [keyPrefix]="uploadKeyPrefix()"
          [actions]="actions()"
          [clearable]="clearable()"
          [name]="imageName()"
          [url]="imageUrl()"
          (picked)="imageChange.emit($event)"
          (cleared)="imageCleared.emit()"
        />
      </div>
    }
  </div>
</article>
