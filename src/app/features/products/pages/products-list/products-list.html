<section class="page product-board">
  <app-page-header [title]="lang.t('product.manage')" [subtitle]="lang.t('product.subtitle')" />
  <section class="product-board__body">
    <div class="product-board__toolbar">
      <ng-container *appHasPermission="'products.update'">
        <label class="product-board__catalog">
          <span>{{ lang.t('product.catalog') }}</span>
          <p-toggleswitch
            [ngModel]="api.catalogVisible()"
            (ngModelChange)="api.toggleCatalog()"
            [ariaLabel]="lang.t('product.catalog')"
          />
        </label>
      </ng-container>
      <a *appHasPermission="'products.create'" class="product-board__add" routerLink="/products/new">
        {{ lang.t('product.add') }}
        <i class="pi pi-plus" aria-hidden="true"></i>
      </a>
    </div>

    @if (status() === 'loading') {
      <app-state-view mode="loading" />
    } @else if (status() === 'error') {
      <app-state-view mode="error" [message]="lang.t('common.error')" (retry)="retry()" />
    } @else if (total() === 0) {
      <app-state-view mode="empty" [message]="lang.t('product.empty')" />
    } @else {
      <div class="product-grid">
        @for (product of visible(); track product.id; let index = $index) {
          <app-product-card
            [imageUrl]="product.coverUrl"
            [title]="text(product)"
            [summary]="summary(product)"
            [features]="cardFeatures(product)"
            [revealed]="index === 1"
            [deleteLabel]="lang.t('product.deleteTitle')"
            [editLabel]="lang.t('product.edit')"
            [viewLabel]="lang.t('product.view')"
            [moreLabel]="lang.t('product.view')"
            [showDelete]="canDelete()"
            [showEdit]="canUpdate()"
            (deleteRequested)="remove(product)"
            (editRequested)="openEditor(product)"
            (viewRequested)="openDetails(product)"
            (moreRequested)="openMenu($event, product)"
          />
        }
      </div>

      <app-paginator
        [first]="first()"
        [rows]="rows()"
        [totalRecords]="total()"
        (pageChange)="page($event)"
      />
    }
  </section>

  <p-popover #actions appendTo="body">
    @if (menuProduct(); as current) {
      <div class="product-menu">
        <a [routerLink]="['/products', current.id]" (click)="closeMenu()">{{
          lang.t('product.view')
        }}</a>
        <a
          *appHasPermission="'products.update'"
          [routerLink]="['/products', current.id, 'edit']"
          (click)="closeMenu()"
          >{{ lang.t('product.edit') }}</a
        >
        <button *appHasPermission="'products.delete'" type="button" (click)="remove(current)">
          {{ lang.t('product.deleteTitle') }}
        </button>
      </div>
    }
  </p-popover>
  <app-confirm-dialog />
</section>
