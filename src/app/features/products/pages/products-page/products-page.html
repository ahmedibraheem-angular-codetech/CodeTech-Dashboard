<section class="page products-manage">
  <app-page-header
    [title]="lang.t('nav.productsPage')"
    [subtitle]="lang.t('product.page.subtitle')"
  />

  @if (status() === 'loading' || !content()) {
    <app-state-view mode="loading" [message]="lang.t('common.loading')" />
  } @else if (content(); as page) {
    <app-products-page-features
      [features]="page.features"
      [enabled]="page.featuresEnabled"
      [displayLocale]="lang.language()"
      (enabledChange)="toggleFeatures($event)"
      (add)="openFeature()"
      (edit)="openFeature($event)"
      (remove)="removeFeature($event)"
    />

    <app-products-page-sectors
      [sectors]="page.sectors"
      [enabled]="page.sectorsEnabled"
      [displayLocale]="lang.language()"
      (enabledChange)="toggleSectors($event)"
      (add)="openSector()"
      (edit)="openSector($event)"
      (remove)="removeSector($event)"
    />
  }

  <app-modal
    [(visible)]="editorOpen"
    [title]="editorTitle()"
    [icon]="editorKind() === 'feature' ? 'pi pi-plus-circle' : 'pi pi-image'"
    [saving]="saving()"
    [saveDisabled]="
      editorKind() === 'feature'
        ? !text(draftFeature().title).trim()
        : !text(draftSector().title).trim() || !draftSector().imageUrl
    "
    [saveLabel]="saveLabel()"
    saveIcon=""
    (save)="saveEditor()"
  >
    <app-products-page-editor-form
      [kind]="editorKind()"
      [(locale)]="locale"
      [(feature)]="draftFeature"
      [(sector)]="draftSector"
    />
  </app-modal>

  <app-confirm-dialog />
</section>
