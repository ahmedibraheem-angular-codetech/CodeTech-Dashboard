<section class="editor-section editor-section--units">
  <header class="editor-section__head">
    <h2>{{ editor.copy('product.units') }}</h2>
    <span class="icon-badge" aria-hidden="true"><i class="pi pi-cog"></i></span>
  </header>
  <div class="editor-section__body">
    @for (unit of editor.draft().units; track unit.id; let index = $index) {
      <article class="unit-block">
        <app-feature-card
          [label]="editor.unitName(index)"
          [title]="editor.text(unit.title)"
          [titleLabel]="editor.copy('product.unitTitle')"
          [titlePlaceholder]="editor.copy('product.unitTitlePh')"
          [body]="editor.text(unit.body)"
          [bodyLabel]="editor.copy('product.unitBody')"
          [bodyPlaceholder]="editor.copy('product.unitBodyPh')"
          [iconLabel]="editor.copy('product.uploadLabel')"
          [imageName]="unit.imageName"
          [imageUrl]="unit.imageUrl"
          [locale]="editor.locale()"
          [actions]="false"
          [removeDisabled]="editor.draft().units.length === 1 || editor.saving()"
          [removeLabel]="editor.copy('product.deleteTitle')"
          (titleChange)="editor.setUnit(index, 'title', $event)"
          (bodyChange)="editor.setUnit(index, 'body', $event)"
          (imageChange)="editor.setUnitImage(index, $event)"
          (removed)="editor.removeUnit(index)"
        />
        <div class="unit-grid">
          @for (point of unit.points; track point.id; let pointIndex = $index) {
            <div class="unit-feature-wrap">
              <app-feature-card
                [label]="editor.copy('product.featureItem') + ' ' + (pointIndex + 1)"
                [title]="editor.text(point.title)"
                [titleLabel]="editor.copy('product.unitFeatureName')"
                [titlePlaceholder]="editor.copy('product.unitFeatureNamePh')"
                [body]="editor.text(point.body)"
                [bodyLabel]="editor.copy('product.featureBody')"
                [bodyPlaceholder]="editor.copy('product.unitFeatureBodyPh')"
                [iconLabel]="editor.copy('product.icon')"
                [imageName]="point.imageName"
                [imageUrl]="point.imageUrl"
                [locale]="editor.locale()"
                [removeDisabled]="unit.points.length === 1 || editor.saving()"
                [removeLabel]="editor.copy('product.deleteTitle')"
                (removed)="editor.removeUnitPoint(index, pointIndex)"
                (titleChange)="editor.setUnitPoint(index, pointIndex, 'title', $event)"
                (bodyChange)="editor.setUnitPoint(index, pointIndex, 'body', $event)"
                (imageChange)="editor.setUnitPointImage(index, pointIndex, $event)"
              />
            </div>
          }
        </div>
      </article>
    }
    <button type="button" class="add-row" (click)="editor.addUnit()">
      <span class="add-row__mark" aria-hidden="true"><i class="pi pi-plus"></i></span>
      {{ editor.copy('product.addUnit') }}
    </button>
  </div>
</section>
