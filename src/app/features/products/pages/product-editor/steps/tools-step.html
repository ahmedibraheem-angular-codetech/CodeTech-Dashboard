<section class="editor-section">
  <header class="editor-section__head">
    <h2>{{ editor.copy('product.tools') }}</h2>
    <span class="icon-badge" aria-hidden="true"><i class="pi pi-star"></i></span>
  </header>
  <div class="editor-section__body">
    @for (tool of editor.draft().tools; track tool.id; let index = $index) {
      <app-feature-card
        [label]="editor.copy('product.featureItem') + ' ' + (index + 1)"
        [title]="editor.text(tool.title)"
        [titleLabel]="editor.copy('product.featureTitle')"
        [titlePlaceholder]="editor.copy('product.featureTitlePh')"
        [body]="editor.text(tool.body)"
        [bodyLabel]="editor.copy('product.featureBody')"
        [bodyPlaceholder]="editor.copy('product.featureBody')"
        [iconLabel]="editor.copy('product.icon')"
        [imageName]="tool.imageName"
        [imageUrl]="tool.imageUrl"
        [locale]="editor.locale()"
        [removeDisabled]="editor.draft().tools.length === 1"
        [removeLabel]="editor.copy('product.deleteTitle')"
        (titleChange)="editor.setMediaText('tools', index, 'title', $event)"
        (bodyChange)="editor.setMediaText('tools', index, 'body', $event)"
        (imageChange)="editor.setMediaImage('tools', index, $event)"
        (removed)="editor.removeMedia('tools', index)"
      />
    }
    <button type="button" class="add-row" (click)="editor.addMedia('tools')">
      <span class="add-row__mark" aria-hidden="true"><i class="pi pi-plus"></i></span>
      {{ editor.copy('product.addFeature') }}
    </button>
  </div>
</section>
<section class="editor-section">
  <header class="editor-section__head">
    <h2>{{ editor.copy('product.integration') }}</h2>
    <span class="icon-badge" aria-hidden="true"><i class="pi pi-code"></i></span>
  </header>
  <div class="editor-section__body">
    @for (item of editor.draft().integrations; track item.id; let index = $index) {
      <app-feature-card
        [label]="editor.copy('product.toolItem') + ' ' + (index + 1)"
        [title]="editor.text(item.title)"
        [titleLabel]="editor.copy('product.featureTitle')"
        [titlePlaceholder]="editor.copy('product.featureTitlePh')"
        [body]="editor.text(item.body)"
        [bodyLabel]="editor.copy('product.featureBody')"
        [bodyPlaceholder]="editor.copy('product.featureBody')"
        [iconLabel]="editor.copy('product.uploadLabel')"
        [imageName]="item.imageName"
        [imageUrl]="item.imageUrl"
        [locale]="editor.locale()"
        [actions]="false"
        [removeDisabled]="editor.draft().integrations.length === 1"
        [removeLabel]="editor.copy('product.deleteTitle')"
        (titleChange)="editor.setMediaText('integrations', index, 'title', $event)"
        (bodyChange)="editor.setMediaText('integrations', index, 'body', $event)"
        (imageChange)="editor.setMediaImage('integrations', index, $event)"
        (removed)="editor.removeMedia('integrations', index)"
      />
    }
    <button type="button" class="add-row" (click)="editor.addMedia('integrations')">
      <span class="add-row__mark" aria-hidden="true"><i class="pi pi-plus"></i></span>
      {{ editor.copy('product.addTool') }}
    </button>
  </div>
</section>
