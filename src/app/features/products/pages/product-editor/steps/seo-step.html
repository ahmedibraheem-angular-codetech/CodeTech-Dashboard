<section class="editor-section editor-section--seo">
  <header class="editor-section__head">
    <h2>SEO</h2>
    <span class="icon-badge" aria-hidden="true"><i class="pi pi-search"></i></span>
  </header>
  <div class="editor-section__body">
    <label class="field">
      <span class="field__label">{{ editor.copy('product.seoSlug') }}</span>
      <span class="seo-field">
        <i class="seo-field__icon pi pi-link" aria-hidden="true"></i>
        <input
          pInputText
          [fluid]="true"
          [value]="editor.text(editor.draft().seo.slug)"
          [placeholder]="editor.copy('product.seoSlugPh')"
          (input)="editor.setSeo('slug', $event)"
        />
      </span>
      <small class="field__hint">{{ editor.copy('product.seoSlugHint') }}</small>
      @if (editor.slugErrorText()) {
        <app-field-error>{{ editor.slugErrorText() }}</app-field-error>
      }
    </label>
    <label class="field">
      <span class="field__label">{{ editor.copy('product.seoTitle') }}</span>
      <span class="seo-field">
        <span class="seo-field__mark" aria-hidden="true">T</span>
        <input
          pInputText
          [fluid]="true"
          [value]="editor.text(editor.draft().seo.title)"
          [placeholder]="editor.copy('product.seoTitlePh')"
          (input)="editor.setSeo('title', $event)"
        />
      </span>
    </label>
    <label class="field">
      <span class="field__label">{{ editor.copy('product.seoKeywords') }}</span>
      <span class="seo-field">
        <i class="seo-field__icon pi pi-tag" aria-hidden="true"></i>
        <input
          pInputText
          [fluid]="true"
          [value]="editor.text(editor.draft().seo.keywords)"
          [placeholder]="editor.copy('product.seoKeywordsPh')"
          (input)="editor.setSeo('keywords', $event)"
        />
      </span>
      <small class="counter">{{ editor.keywordsLongest() }}/{{ editor.keywordsMax }}</small>
      @if (editor.keywordsErrorText()) {
        <app-field-error>{{ editor.keywordsErrorText() }}</app-field-error>
      }
    </label>
    <label class="field seo-description">
      <span class="field__label">{{ editor.copy('product.seoDescription') }}</span>
      <textarea
        pTextarea
        [fluid]="true"
        rows="4"
        [attr.maxlength]="editor.descriptionMax"
        [value]="editor.text(editor.draft().seo.description)"
        [placeholder]="editor.copy('product.seoDescriptionPh')"
        (input)="editor.setSeo('description', $event)"
      ></textarea>
      <small class="counter"
        >{{ editor.text(editor.draft().seo.description).length }}/{{ editor.descriptionMax }}</small
      >
    </label>
  </div>
</section>
