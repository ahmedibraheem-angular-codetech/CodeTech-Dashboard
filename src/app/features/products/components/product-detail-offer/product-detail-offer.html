<div class="detail-stack">
  <article class="detail-panel">
    <header class="detail-panel__head">
      <h2>{{ lang.t('product.offer') }}</h2>
      <span class="icon-badge"><i class="pi pi-list" aria-hidden="true"></i></span>
    </header>
    <app-detail-points [items]="product().offer" [locale]="locale()" fallback="pi-list" />
  </article>

  <article class="detail-panel">
    <header class="detail-panel__head">
      <h2>{{ lang.t('product.results') }}</h2>
      <span class="icon-badge"><i class="pi pi-chart-bar" aria-hidden="true"></i></span>
    </header>
    <app-detail-points [items]="product().results" [locale]="locale()" fallback="pi-chart-bar" />
  </article>

  <article class="detail-panel">
    <header class="detail-panel__head">
      <h2>{{ lang.t('product.integration') }}</h2>
      <span class="icon-badge"><i class="pi pi-link" aria-hidden="true"></i></span>
    </header>
    <div class="logo-grid">
      @for (item of product().integrations; track item.id; let index = $index) {
        <article class="logo-card">
          @if (iconClass(item.imageUrl); as icon) {
            <i [class]="icon" aria-hidden="true"></i>
          } @else if (item.imageUrl) {
            <img [src]="item.imageUrl" [alt]="text(item.title)" />
          }
          @if (canUpdate()) {
            <span class="sector-card__actions">
              <a
                [routerLink]="['/products', product().id, 'edit']"
                [attr.aria-label]="lang.t('product.editAction')"
              >
                <i class="pi pi-pen-to-square" aria-hidden="true"></i>
              </a>
              <button
                type="button"
                [disabled]="product().integrations.length < 2"
                [attr.aria-label]="lang.t('about.delete')"
                (click)="removeItem.emit({ list: 'integrations', index })"
              >
                <i class="pi pi-trash" aria-hidden="true"></i>
              </button>
            </span>
          }
        </article>
      }
    </div>
  </article>
</div>
