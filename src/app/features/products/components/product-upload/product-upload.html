@if (actions()) {
  <div class="uploader__actions">
    <button type="button" class="uploader__action" (click)="open(file)">
      {{ copy('product.chooseLibrary') }}
      <i class="pi pi-face-smile" aria-hidden="true"></i>
    </button>
    <button type="button" class="uploader__action uploader__action--primary" (click)="open(file)">
      {{ copy('product.uploadIcon') }}
      <i class="pi pi-folder" aria-hidden="true"></i>
    </button>
  </div>
}
<label class="uploader">
  @if (url()) {
    <img class="uploader__preview" [src]="url()" alt="" />
  } @else {
    <span class="uploader__mark" aria-hidden="true"><i class="pi pi-file"></i></span>
  }
  <span>{{ copy('product.uploadHint') }}</span>
  <small>{{ name() || copy('product.uploadTypes') }}</small>
  <input #file type="file" accept="image/png,image/jpeg" (change)="choose($event)" />
</label>
