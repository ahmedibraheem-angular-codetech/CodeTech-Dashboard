<article class="detail-panel" [class.is-off]="!enabled()">
  <header class="products-manage__head">
    <div class="products-manage__title">
      <h2>{{ lang.t('product.page.why') }}</h2>
      <ng-container *appHasPermission="'products.update'">
        <p-toggleswitch
          [ngModel]="enabled()"
          (ngModelChange)="enabledChange.emit($event)"
          [ariaLabel]="lang.t('product.page.why')"
        />
      </ng-container>
    </div>
    <app-button
      *appHasPermission="'products.create'"
      variant="outlined"
      icon="pi pi-plus"
      iconPos="end"
      [rounded]="true"
      styleClass="products-manage__add"
      [label]="lang.t('product.page.addFeature')"
      (clicked)="add.emit()"
    />
  </header>
  <div class="manage-feature-grid">
    @for (feature of features(); track feature.id) {
      <article class="manage-feature-card">
        <div class="manage-feature-card__bar">
          <span class="manage-feature-card__icon">
            @if (feature.imageUrl && !feature.imageUrl.startsWith('icon:')) {
              <img [src]="feature.imageUrl" alt="" />
            } @else {
              <i [class]="'pi ' + feature.icon" aria-hidden="true"></i>
            }
          </span>
          @if (canUpdate() || canDelete()) {
            <span class="manage-feature-card__actions">
              @if (canUpdate()) {
                <button
                  type="button"
                  class="manage-tool manage-tool--edit"
                  [attr.aria-label]="lang.t('product.editAction')"
                  (click)="edit.emit(feature)"
                >
                  <i class="pi pi-pen-to-square" aria-hidden="true"></i>
                </button>
              }
              @if (canDelete()) {
                <button
                  type="button"
                  class="manage-tool manage-tool--delete"
                  [attr.aria-label]="lang.t('about.delete')"
                  (click)="remove.emit(feature)"
                >
                  <i class="pi pi-trash" aria-hidden="true"></i>
                </button>
              }
            </span>
          }
        </div>
        <strong>{{ text(feature.title) }}</strong>
        <p>{{ text(feature.body) }}</p>
      </article>
    }
  </div>
</article>
