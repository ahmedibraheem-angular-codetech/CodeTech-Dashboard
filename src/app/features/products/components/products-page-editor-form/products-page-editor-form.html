<div class="block-form" [attr.dir]="locale() === 'ar' ? 'rtl' : 'ltr'">
  <app-locale-switch [value]="locale()" (picked)="locale.set($event)" />
  @if (kind() === 'feature') {
    <label class="field">
      <span class="field__label">{{ copy('product.featureTitle') }}</span>
      <p-iconfield>
        <input
          pInputText
          [fluid]="true"
          [value]="text(feature().title)"
          [placeholder]="copy('product.featureTitlePh')"
          (input)="setFeatureText('title', $event)"
        />
        <p-inputicon class="pi pi-pen-to-square" />
      </p-iconfield>
    </label>
    <label class="field">
      <span class="field__label">{{ copy('product.page.featureBody') }}</span>
      <textarea
        pTextarea
        [fluid]="true"
        rows="4"
        [value]="text(feature().body)"
        [placeholder]="copy('product.page.featureBodyPh')"
        (input)="setFeatureText('body', $event)"
      ></textarea>
    </label>
    <div class="field">
      <span class="field__label">{{ copy('product.uploadIcon') }}</span>
      <app-product-upload
        [locale]="locale()"
        [name]="feature().imageName"
        [url]="feature().imageUrl"
        (picked)="setFeatureImage($event)"
      />
    </div>
  } @else {
    <label class="field">
      <span class="field__label">{{ copy('product.page.sectorTitle') }}</span>
      <p-iconfield>
        <input
          pInputText
          [fluid]="true"
          [value]="text(sector().title)"
          [placeholder]="copy('product.page.sectorTitlePh')"
          (input)="setSectorTitle($event)"
        />
        <p-inputicon class="pi pi-pen-to-square" />
      </p-iconfield>
    </label>
    <div class="field">
      <span class="field__label">{{ copy('product.sectorImage') }}</span>
      <app-product-upload
        [locale]="locale()"
        [name]="sector().image[locale()].imageName"
        [url]="sector().image[locale()].imageUrl"
        (picked)="setSectorImage($event)"
      />
    </div>
  }
</div>
