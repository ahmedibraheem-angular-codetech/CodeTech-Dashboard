<form
  class="users-editor-form"
  [attr.dir]="locale() === 'ar' ? 'rtl' : 'ltr'"
  [formGroup]="form()"
  (ngSubmit)="onSubmit()"
>
  <app-locale-switch [value]="locale()" (picked)="locale.set($event)" />

  <label class="field">
    <span class="field__label">{{ t('users.username') }}</span>
    <p-iconfield>
      <p-inputicon class="pi pi-user" />
      <input
        pInputText
        [fluid]="true"
        formControlName="name"
        [invalid]="form().controls.name.touched && form().controls.name.invalid"
        [attr.aria-invalid]="form().controls.name.touched && form().controls.name.invalid"
        [attr.aria-describedby]="
          form().controls.name.touched && form().controls.name.invalid ? 'user-name-error' : null
        "
      />
    </p-iconfield>
    @if (form().controls.name.touched && form().controls.name.invalid) {
      <app-field-error id="user-name-error">{{ t('users.required') }}</app-field-error>
    }
  </label>

  <div class="users-editor-form__row">
    <label class="field">
      <span class="field__label">{{ t('users.email') }}</span>
      <p-iconfield>
        <p-inputicon class="pi pi-envelope" />
        <input
          pInputText
          [fluid]="true"
          type="email"
          formControlName="email"
          [invalid]="form().controls.email.touched && form().controls.email.invalid"
          [attr.aria-invalid]="form().controls.email.touched && form().controls.email.invalid"
          [attr.aria-describedby]="
            form().controls.email.touched && form().controls.email.invalid
              ? 'user-email-error'
              : null
          "
        />
      </p-iconfield>
      @if (form().controls.email.touched && form().controls.email.hasError('required')) {
        <app-field-error id="user-email-error">{{ t('users.required') }}</app-field-error>
      } @else if (form().controls.email.touched && form().controls.email.invalid) {
        <app-field-error id="user-email-error">{{ t('users.invalidEmail') }}</app-field-error>
      }
    </label>

    <label class="field">
      <span class="field__label">{{ t('users.phoneOptional') }}</span>
      <p-iconfield>
        <p-inputicon class="pi pi-phone" />
        <input
          pInputText
          [fluid]="true"
          formControlName="phone"
          [invalid]="form().controls.phone.touched && form().controls.phone.invalid"
          [attr.aria-invalid]="form().controls.phone.touched && form().controls.phone.invalid"
          [attr.aria-describedby]="
            form().controls.phone.touched && form().controls.phone.invalid
              ? 'user-phone-error'
              : null
          "
        />
      </p-iconfield>
      @if (form().controls.phone.touched && form().controls.phone.hasError('required')) {
        <app-field-error id="user-phone-error">{{ t('users.required') }}</app-field-error>
      } @else if (form().controls.phone.touched && form().controls.phone.invalid) {
        <app-field-error id="user-phone-error">{{ t('users.invalidPhone') }}</app-field-error>
      }
    </label>
  </div>

  <div class="users-editor-form__row">
    <label class="field">
      <span class="field__label">{{ t('users.userStatus') }}</span>
      <p-select
        [fluid]="true"
        formControlName="status"
        [options]="formStatuses()"
        optionLabel="label"
        optionValue="value"
      />
    </label>

    <label class="field">
      <span class="field__label">{{ t('users.role') }}</span>
      <p-select
        [fluid]="true"
        formControlName="role"
        [options]="formRoles()"
        optionLabel="label"
        optionValue="value"
      />
    </label>
  </div>

  <div class="field">
    <span class="field__label">{{ t('users.uploadPhoto') }}</span>
    <label
      class="users-editor-form__drop"
      (dragover)="$event.preventDefault()"
      (drop)="onPhotoDrop($event)"
    >
      <i class="pi pi-file-arrow-up" aria-hidden="true"></i>
      <strong>{{ t('users.uploadHint') }}</strong>
      <small>{{ t('users.uploadTypes') }}</small>
      <input
        type="file"
        accept="image/png,image/jpeg"
        [attr.aria-label]="t('users.uploadPhoto')"
        (change)="onPhotoPick($event)"
      />
    </label>

    @if (photo(); as file) {
      <div class="users-editor-form__file">
        <img class="users-editor-form__thumb" [src]="file.url" alt="" />
        <div class="users-editor-form__file-meta">
          <strong>{{ file.name }}</strong>
          <span>{{ file.sizeLabel }} · {{ file.dateLabel }}</span>
        </div>
        <app-button
          variant="danger"
          [outlined]="true"
          styleClass="users-editor-form__file-remove"
          icon="pi pi-trash"
          [ariaLabel]="t('users.removePhoto')"
          (clicked)="clearPhoto()"
        />
      </div>
    }
  </div>
</form>
