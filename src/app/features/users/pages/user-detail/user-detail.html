@if (status() === 'loading') {
  <app-state-view mode="loading" />
} @else if (status() === 'error') {
  <app-state-view mode="error" [message]="lang.t('users.loadError')" (retry)="reload()" />
} @else if (status() === 'missing' || !user()) {
  <app-state-view mode="empty" [message]="lang.t('users.notFound')" />
} @else if (user(); as current) {
  <section class="page user-detail">
    <app-user-detail-profile
      [user]="current"
      [avatarUrl]="avatarUrl"
      [roleLabel]="roleLabel()"
      [statusLabel]="statusLabel()"
      [timeLabel]="timeLabel()"
      [isBlocked]="isBlocked()"
      [saving]="saving()"
      [statusChoices]="statusChoices()"
      (edit)="openEdit()"
      (remove)="remove()"
      (statusChange)="setStatus($event)"
    />

    <app-user-detail-fields
      [user]="current"
      [displayCode]="displayCode()"
      [roleLabel]="roleLabel()"
      [statusLabel]="statusLabel()"
      [stamp]="stamp()"
      [isBlocked]="isBlocked()"
    />

    @if (isBlocked()) {
      <app-user-detail-ban [stamp]="stamp()" />
    }
  </section>
}

<app-modal
  [visible]="editing()"
  (visibleChange)="setEditingVisible($event)"
  [title]="editorTitle()"
  icon="pi pi-user-edit"
  [saveLabel]="editorSaveLabel()"
  saveIcon="pi pi-save"
  saveIconPos="start"
  [cancelLabel]="editorT('common.cancel')"
  [saving]="saving()"
  (save)="save()"
  (cancel)="closeEditor()"
>
  <app-user-editor-form [form]="form" [(locale)]="editorLocale" (submitted)="save()" />
</app-modal>

<app-confirm-dialog />
