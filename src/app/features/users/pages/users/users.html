<section class="page users-page">
  <app-page-header [title]="lang.t('nav.manageUsers')" [subtitle]="lang.t('users.pageSubtitle')">
    <app-button
      icon="pi pi-plus"
      iconPos="end"
      styleClass="users-add"
      [label]="lang.t('users.addNew')"
      (clicked)="openCreate()"
    />
  </app-page-header>

  @if (state() === 'loading') {
    <app-state-view mode="loading" />
  } @else if (state() === 'error') {
    <app-state-view mode="error" [message]="lang.t('users.loadError')" (retry)="load()" />
  } @else {
    <app-statistics-cards [cards]="cards()" />

    <app-data-table
      class="users-table"
      [title]="tableTitle()"
      [rows]="tableRows()"
      [columns]="columns()"
      [exportLabel]="lang.t('users.export')"
      [searchLabel]="lang.t('users.search')"
      [emptyMessage]="lang.t('users.empty')"
      [rowClickable]="true"
      [(query)]="query"
      (export)="exported($event)"
      (rowClick)="openDetail($event)"
    >
      <div dtTools class="users-table__selects">
        <p-select
          styleClass="users-table__select"
          [options]="roleOptions()"
          optionLabel="label"
          optionValue="value"
          [ngModel]="role()"
          (ngModelChange)="role.set($event)"
          [ariaLabel]="lang.t('users.role')"
        />
        <p-select
          styleClass="users-table__select"
          [options]="statusOptions()"
          optionLabel="label"
          optionValue="value"
          [ngModel]="status()"
          (ngModelChange)="status.set($event)"
          [ariaLabel]="lang.t('users.status')"
        />
      </div>

      <ng-template appDataCell="actions" let-row>
        <app-button
          styleClass="users-table__more"
          icon="pi pi-ellipsis-v"
          variant="outlined"
          [ariaLabel]="lang.t('users.actions')"
          (clicked)="openMenu($event, row.source)"
        />
      </ng-template>

      <app-paginator
        dtFooter
        [first]="first()"
        [rows]="pageSize()"
        [totalRecords]="filtered().length"
        (pageChange)="page($event)"
      />
    </app-data-table>
  }
</section>

<p-popover #actions appendTo="body" styleClass="users-menu">
  @if (menuUser(); as current) {
    <div class="users-menu__list">
      <button type="button" (click)="openView(current)">{{ lang.t('users.view') }}</button>
      <button type="button" (click)="openEdit(current)">{{ lang.t('users.edit') }}</button>
      <button type="button" class="users-menu__danger" (click)="remove(current)">
        {{ lang.t('users.delete') }}
      </button>
    </div>
  }
</p-popover>

<app-modal
  [visible]="editor() !== null"
  (visibleChange)="setEditorVisible($event)"
  [title]="editorTitle()"
  [icon]="editor() === 'create' ? 'pi pi-user-plus' : 'pi pi-user-edit'"
  [saveLabel]="editorSaveLabel()"
  [saveIcon]="editor() === 'create' ? 'pi pi-plus' : 'pi pi-save'"
  saveIconPos="start"
  [cancelLabel]="editorT('common.cancel')"
  [saving]="saving()"
  (save)="save()"
  (cancel)="closeEditor()"
>
  <form
    class="users-editor-form"
    [attr.dir]="editorLocale() === 'ar' ? 'rtl' : 'ltr'"
    [formGroup]="form"
    (ngSubmit)="save()"
  >
    <app-locale-switch [value]="editorLocale()" (picked)="editorLocale.set($event)" />

    <label class="field">
      <span class="field__label">{{ editorT('users.username') }}</span>
      <p-iconfield>
        <p-inputicon class="pi pi-user" />
        <input
          pInputText
          [fluid]="true"
          formControlName="name"
          [invalid]="form.controls.name.touched && form.controls.name.invalid"
          [attr.aria-invalid]="form.controls.name.touched && form.controls.name.invalid"
          [attr.aria-describedby]="
            form.controls.name.touched && form.controls.name.invalid ? 'user-name-error' : null
          "
        />
      </p-iconfield>
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <app-field-error id="user-name-error">{{ editorT('users.required') }}</app-field-error>
      }
    </label>

    <div class="users-editor-form__row">
      <label class="field">
        <span class="field__label">{{ editorT('users.email') }}</span>
        <p-iconfield>
          <p-inputicon class="pi pi-envelope" />
          <input
            pInputText
            [fluid]="true"
            type="email"
            formControlName="email"
            [invalid]="form.controls.email.touched && form.controls.email.invalid"
            [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
            [attr.aria-describedby]="
              form.controls.email.touched && form.controls.email.invalid ? 'user-email-error' : null
            "
          />
        </p-iconfield>
        @if (form.controls.email.touched && form.controls.email.hasError('required')) {
          <app-field-error id="user-email-error">{{ editorT('users.required') }}</app-field-error>
        } @else if (form.controls.email.touched && form.controls.email.invalid) {
          <app-field-error id="user-email-error">{{ editorT('users.invalidEmail') }}</app-field-error>
        }
      </label>

      <label class="field">
        <span class="field__label">{{ editorT('users.phoneOptional') }}</span>
        <p-iconfield>
          <p-inputicon class="pi pi-phone" />
          <input
            pInputText
            [fluid]="true"
            formControlName="phone"
            [invalid]="form.controls.phone.touched && form.controls.phone.invalid"
            [attr.aria-invalid]="form.controls.phone.touched && form.controls.phone.invalid"
            [attr.aria-describedby]="
              form.controls.phone.touched && form.controls.phone.invalid ? 'user-phone-error' : null
            "
          />
        </p-iconfield>
        @if (form.controls.phone.touched && form.controls.phone.hasError('required')) {
          <app-field-error id="user-phone-error">{{ editorT('users.required') }}</app-field-error>
        } @else if (form.controls.phone.touched && form.controls.phone.invalid) {
          <app-field-error id="user-phone-error">{{ editorT('users.invalidPhone') }}</app-field-error>
        }
      </label>
    </div>

    <div class="users-editor-form__row">
      <label class="field">
        <span class="field__label">{{ editorT('users.userStatus') }}</span>
        <p-select
          [fluid]="true"
          formControlName="status"
          [options]="formStatuses()"
          optionLabel="label"
          optionValue="value"
        />
      </label>

      <label class="field">
        <span class="field__label">{{ editorT('users.role') }}</span>
        <p-select
          [fluid]="true"
          formControlName="role"
          [options]="formRoles()"
          optionLabel="label"
          optionValue="value"
        />
      </label>
    </div>

    <div class="field">
      <span class="field__label">{{ editorT('users.uploadPhoto') }}</span>
      <label
        class="users-editor-form__drop"
        (dragover)="$event.preventDefault()"
        (drop)="onPhotoDrop($event)"
      >
        <i class="pi pi-file-arrow-up" aria-hidden="true"></i>
        <strong>{{ editorT('users.uploadHint') }}</strong>
        <small>{{ editorT('users.uploadTypes') }}</small>
        <input
          type="file"
          accept="image/png,image/jpeg"
          [attr.aria-label]="editorT('users.uploadPhoto')"
          (change)="onPhotoPick($event)"
        />
      </label>

      @if (photo(); as file) {
        <div class="users-editor-form__file">
          <img class="users-editor-form__thumb" [src]="file.url" alt="" />
          <div class="users-editor-form__file-meta">
            <strong>{{ file.name }}</strong>
            <span>{{ file.sizeLabel }} · {{ file.dateLabel }}</span>
          </div>
          <app-button
            variant="danger"
            [outlined]="true"
            styleClass="users-editor-form__file-remove"
            icon="pi pi-trash"
            [ariaLabel]="editorT('users.removePhoto')"
            (clicked)="clearPhoto()"
          />
        </div>
      }
    </div>
  </form>
</app-modal>

<app-confirm-dialog />
