<section class="page users-page">
  <app-page-header [title]="lang.t('nav.manageUsers')" [subtitle]="lang.t('users.pageSubtitle')">
    <app-button
      icon="pi pi-plus"
      iconPos="end"
      styleClass="users-add"
      [label]="lang.t('users.addNew')"
      (clicked)="openCreate()"
    />
  </app-page-header>

  @if (state() === 'loading') {
    <app-state-view mode="loading" />
  } @else if (state() === 'error') {
    <app-state-view mode="error" [message]="lang.t('users.loadError')" (retry)="load()" />
  } @else {
    <app-statistics-cards [cards]="cards()" />

    <app-data-table
      class="users-table"
      [title]="tableTitle()"
      [rows]="tableRows()"
      [columns]="columns()"
      [exportLabel]="lang.t('users.export')"
      [searchLabel]="lang.t('users.search')"
      [emptyMessage]="lang.t('users.empty')"
      [rowClickable]="true"
      [(query)]="query"
      (export)="exported($event)"
      (rowClick)="openDetail($event)"
    >
      <div dtTools class="users-table__selects">
        <p-select
          styleClass="users-table__select"
          [options]="roleOptions()"
          optionLabel="label"
          optionValue="value"
          [ngModel]="role()"
          (ngModelChange)="role.set($event)"
          [ariaLabel]="lang.t('users.role')"
        />
        <p-select
          styleClass="users-table__select"
          [options]="statusOptions()"
          optionLabel="label"
          optionValue="value"
          [ngModel]="status()"
          (ngModelChange)="status.set($event)"
          [ariaLabel]="lang.t('users.status')"
        />
      </div>

      <ng-template appDataCell="actions" let-row>
        <app-button
          styleClass="users-table__more"
          icon="pi pi-ellipsis-v"
          variant="outlined"
          [ariaLabel]="lang.t('users.actions')"
          (clicked)="openMenu($event, row.source)"
        />
      </ng-template>

      <app-paginator
        dtFooter
        [first]="first()"
        [rows]="pageSize()"
        [totalRecords]="filtered().length"
        (pageChange)="page($event)"
      />
    </app-data-table>
  }
</section>

<p-popover #actions appendTo="body" styleClass="users-menu">
  @if (menuUser(); as current) {
    <div class="users-menu__list">
      <button type="button" (click)="openView(current)">{{ lang.t('users.view') }}</button>
      <button type="button" (click)="openEdit(current)">{{ lang.t('users.edit') }}</button>
      <button type="button" class="users-menu__danger" (click)="remove(current)">
        {{ lang.t('users.delete') }}
      </button>
    </div>
  }
</p-popover>

<app-modal
  [visible]="editor() !== null"
  (visibleChange)="setEditorVisible($event)"
  [title]="editorTitle()"
  [icon]="editor() === 'create' ? 'pi pi-user-plus' : 'pi pi-user-edit'"
  [saveLabel]="editorSaveLabel()"
  [saveIcon]="editor() === 'create' ? 'pi pi-plus' : 'pi pi-save'"
  saveIconPos="start"
  [cancelLabel]="editorT('common.cancel')"
  [saving]="saving()"
  (save)="save()"
  (cancel)="closeEditor()"
>
  <app-user-editor-form [form]="form" [(locale)]="editorLocale" (submitted)="save()" />
</app-modal>

<app-confirm-dialog />
