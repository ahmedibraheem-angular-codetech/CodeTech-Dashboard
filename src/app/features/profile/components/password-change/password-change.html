<article class="section-card profile-card">
  <div class="section-head">
    <div class="section-head__title">
      <span class="icon-badge" aria-hidden="true"><i class="pi pi-lock"></i></span>
      <h2>{{ lang.t('profile.passwordTitle') }}</h2>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="profile-fields">
      @for (field of fields; track field.name) {
        <label class="field">
          <span class="field__label">{{ lang.t(field.labelKey) }}</span>
          <p-iconfield>
            <input
              pInputText
              [fluid]="true"
              [id]="'password-' + field.name"
              [type]="isVisible(field.name) ? 'text' : 'password'"
              [formControlName]="field.name"
              [attr.autocomplete]="field.autocomplete"
              [placeholder]="field.placeholderKey ? lang.t(field.placeholderKey) : ''"
              [invalid]="!!errorKey(field.name)"
              [attr.aria-invalid]="!!errorKey(field.name)"
              [attr.aria-describedby]="
                errorKey(field.name) ? 'password-' + field.name + '-error' : null
              "
            />
            <!-- Real button: p-password's own toggle is click-only and unlabeled. -->
            <p-button
              class="field__toggle"
              type="button"
              severity="secondary"
              [text]="true"
              [rounded]="true"
              size="small"
              [icon]="isVisible(field.name) ? 'pi pi-eye' : 'pi pi-eye-slash'"
              [ariaLabel]="
                lang.t(isVisible(field.name) ? 'auth.hidePassword' : 'auth.showPassword')
              "
              (onClick)="toggle(field.name)"
            />
          </p-iconfield>
          @if (errorKey(field.name); as key) {
            <app-field-error [id]="'password-' + field.name + '-error'">{{
              lang.t(key)
            }}</app-field-error>
          }
        </label>
      }
    </div>

    <div class="profile-actions">
      <p-button
        type="submit"
        class="profile-actions__save"
        styleClass="profile-btn"
        icon="pi pi-save"
        iconPos="right"
        [fluid]="true"
        [label]="lang.t('profile.save')"
        [loading]="saving()"
      />
      <p-button
        type="button"
        class="profile-actions__cancel"
        styleClass="profile-btn"
        severity="secondary"
        [text]="true"
        [fluid]="true"
        [label]="lang.t('profile.cancel')"
        (onClick)="cancel()"
      />
    </div>
  </form>
</article>
