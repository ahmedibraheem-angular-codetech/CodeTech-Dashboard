<article class="section-card profile-card">
  <div class="section-head">
    <div class="section-head__title">
      <span class="icon-badge" aria-hidden="true"><i class="pi pi-user"></i></span>
      <h2>{{ lang.t('profile.dataTitle') }}</h2>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="profile-fields">
      @for (field of fields; track field.name) {
        @let key = errorKey(field.name);
        <div class="field">
          <label class="field__label" [for]="'profile-' + field.name">{{
            lang.t(field.labelKey)
          }}</label>
          <p-iconfield>
            <input
              pInputText
              [fluid]="true"
              [id]="'profile-' + field.name"
              [type]="field.type"
              [formControlName]="field.name"
              [attr.autocomplete]="field.autocomplete"
              [attr.dir]="field.ltr ? 'ltr' : null"
              [class.profile-field--ltr]="field.ltr"
              [invalid]="!!key"
              [attr.aria-invalid]="!!key"
              [attr.aria-describedby]="key ? 'profile-' + field.name + '-error' : null"
            />
            <p-inputicon [class]="field.icon" />
          </p-iconfield>
          @if (key) {
            <app-field-error [id]="'profile-' + field.name + '-error'">{{
              lang.t(key)
            }}</app-field-error>
          }
        </div>
      }
    </div>

    <div class="profile-actions">
      <p-button
        type="submit"
        class="profile-actions__save"
        styleClass="profile-btn"
        icon="pi pi-save"
        iconPos="right"
        [fluid]="true"
        [label]="lang.t('profile.save')"
        [loading]="saving()"
      />
      <p-button
        type="button"
        class="profile-actions__cancel"
        styleClass="profile-btn"
        severity="secondary"
        [text]="true"
        [fluid]="true"
        [label]="lang.t('profile.cancel')"
        [disabled]="pristine()"
        (onClick)="cancel()"
      />
    </div>
  </form>
</article>
