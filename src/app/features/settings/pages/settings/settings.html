<section class="page">
  <app-page-header [title]="lang.t('settings.title')" [subtitle]="lang.t('settings.subtitle')" />

  <article class="section-card" id="general">
    <h2>{{ lang.t('settings.general') }}</h2>
    <div class="setting-row">
      <div>
        <strong>{{ lang.t('settings.sidebar') }}</strong>
        <p class="muted">{{ lang.t('settings.sidebarHint') }}</p>
      </div>
      <p-toggleswitch
        [ngModel]="layout.collapsed()"
        (ngModelChange)="layout.setCollapsed($event)"
        inputId="sidebar-collapsed"
      />
    </div>
    <div class="setting-row">
      <div>
        <strong id="density-label">{{ lang.t('settings.density') }}</strong>
      </div>
      <p-selectbutton
        [options]="densityOptions()"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
        ariaLabelledBy="density-label"
        [ngModel]="layout.density()"
        (ngModelChange)="layout.setDensity($event)"
      />
    </div>
  </article>

  <article class="section-card" id="appearance">
    <h2>{{ lang.t('settings.appearance') }}</h2>
    <div class="setting-row">
      <strong id="theme-label">{{ lang.t('settings.theme') }}</strong>
      <p-selectbutton
        [options]="themeOptions()"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
        ariaLabelledBy="theme-label"
        [ngModel]="theme.theme()"
        (ngModelChange)="theme.set($event)"
      />
    </div>
    <div class="setting-row">
      <strong id="language-label">{{ lang.t('settings.language') }}</strong>
      <p-selectbutton
        [options]="languageOptions()"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
        ariaLabelledBy="language-label"
        [ngModel]="lang.language()"
        (ngModelChange)="lang.set($event)"
      />
    </div>
  </article>
</section>
