<app-modal
  [(visible)]="visible"
  [title]="title()"
  icon="pi pi-pencil"
  [saving]="saving()"
  [saveDisabled]="form.invalid"
  [saveLabel]="lang.t('common.saveChanges')"
  [cancelLabel]="lang.t('common.cancel')"
  saveIconPos="start"
  (save)="onSave()"
  (cancel)="onCancel()"
>
  <form class="social-editor" [formGroup]="form" (ngSubmit)="onSave()">
    <app-locale-switch [value]="locale()" (picked)="setLocale($event)" />

    <label class="field">
      <span class="field__label">{{ lang.t('social.platform') }}</span>
      <p-select
        [options]="platformOptions()"
        formControlName="platform"
        optionLabel="label"
        optionValue="value"
        [fluid]="true"
        appendTo="body"
      />
    </label>

    <label class="field">
      <span class="field__label">{{ lang.t('social.publishStatus') }}</span>
      <p-select
        [options]="statusOptions()"
        formControlName="status"
        optionLabel="label"
        optionValue="value"
        [fluid]="true"
        appendTo="body"
      />
    </label>

    <label class="field">
      <span class="field__label">{{ lang.t('social.link') }}</span>
      <div class="social-editor__link">
        <span class="social-editor__link-badge" aria-hidden="true">
          <i class="pi pi-link"></i>
        </span>
        <input
          class="social-editor__link-input"
          type="url"
          formControlName="url"
          [placeholder]="lang.t('social.linkPlaceholder')"
          autocomplete="off"
          dir="ltr"
        />
        <span class="social-editor__link-open" aria-hidden="true">
          <i class="pi pi-external-link"></i>
        </span>
      </div>
    </label>
  </form>
</app-modal>
