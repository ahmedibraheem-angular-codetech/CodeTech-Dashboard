<article class="social-card" [class.social-card--wide]="wide()">
  <header class="social-card__head">
    <h3>{{ title() }}</h3>
    <p-toggleswitch
      [ngModel]="channel().enabled"
      (ngModelChange)="enabledChange.emit($event)"
      [ariaLabel]="title()"
    />
  </header>

  <div class="social-card__field">
    <button
      type="button"
      class="social-card__icon-btn social-card__icon-btn--start"
      [attr.aria-label]="title()"
      (click)="copyUrl()"
    >
      <i class="pi pi-copy" aria-hidden="true"></i>
    </button>
    <input class="social-card__input" type="text" [value]="url()" readonly tabindex="-1" />
    <button
      type="button"
      class="social-card__icon-btn social-card__icon-btn--end"
      [attr.aria-label]="title()"
      (click)="openUrl()"
    >
      <i class="pi pi-external-link" aria-hidden="true"></i>
    </button>
  </div>

  <div class="social-card__actions">
    <app-button
      [outlined]="true"
      icon="pi pi-pencil"
      iconPos="start"
      [fluid]="true"
      styleClass="social-card__edit"
      [label]="editLabel()"
      (clicked)="edit.emit()"
    />
    <app-button
      variant="danger"
      [outlined]="true"
      icon="pi pi-trash"
      iconPos="start"
      [fluid]="true"
      styleClass="social-card__delete"
      [label]="deleteLabel()"
      (clicked)="remove.emit()"
    />
  </div>
</article>
