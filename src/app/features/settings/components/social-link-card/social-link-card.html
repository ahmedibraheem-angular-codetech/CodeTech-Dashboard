<article class="social-card" [class.social-card--wide]="wide()">
  <header class="social-card__head">
    <h3>{{ title() }}</h3>
    <p-toggleswitch
      [ngModel]="channel().enabled"
      (ngModelChange)="enabledChange.emit($event)"
      [ariaLabel]="title()"
    />
  </header>

  <!-- URL bar is LTR: external (left) → text → copy (right) = matches RTL visual. -->
  <div class="social-card__field" dir="ltr">
    <button
      type="button"
      class="social-card__icon-btn"
      [attr.aria-label]="openLabel()"
      (click)="openUrl()"
    >
      <i class="pi pi-external-link" aria-hidden="true"></i>
    </button>
    <!--
      Readonly but focusable (no tabindex=-1) so keyboard users can select/copy the URL.
      Opening and clipboard copy remain available via the labeled icon buttons.
    -->
    <input
      class="social-card__input"
      type="text"
      [value]="url()"
      [attr.aria-label]="urlFieldLabel()"
      readonly
    />
    <button
      type="button"
      class="social-card__icon-btn"
      [attr.aria-label]="copyLabel()"
      (click)="copyUrl()"
    >
      <i class="pi pi-copy" aria-hidden="true"></i>
    </button>
  </div>

  <div class="social-card__actions">
    <app-button
      [outlined]="true"
      icon="pi pi-pencil"
      iconPos="start"
      [fluid]="true"
      styleClass="social-card__edit"
      [label]="editLabel()"
      (clicked)="edit.emit()"
    />
    <app-button
      variant="danger"
      [outlined]="true"
      icon="pi pi-trash"
      iconPos="start"
      [fluid]="true"
      styleClass="social-card__delete"
      [label]="deleteLabel()"
      (clicked)="remove.emit()"
    />
  </div>
</article>
