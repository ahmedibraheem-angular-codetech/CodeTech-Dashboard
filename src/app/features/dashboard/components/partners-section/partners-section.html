<article class="section-card partners-panel">
  <div class="section-head">
    <div class="section-head__title">
      <h2>
        {{ lang.t(partners().length ? 'home.partners' : 'home.partnersEmptyTitle') }}
        ({{ partners().length }})
      </h2>
    </div>
    @if (partners().length) {
      <p-button icon="pi pi-plus" [label]="lang.t('home.addPartner')" (onClick)="open()" />
    }
  </div>
  @if (partners().length === 0) {
    <app-section-empty
      [title]="lang.t('home.partnersEmpty')"
      [hint]="lang.t('home.partnersEmptyHint')"
    >
      <p-button
        icon="pi pi-plus"
        [label]="lang.t('home.addPartner')"
        severity="secondary"
        variant="outlined"
        (onClick)="open()"
      />
    </app-section-empty>
  } @else {
    <app-content-panel>
      <div class="partner-grid">
        @for (partner of partners(); track partner.id) {
          <article class="partner-card" [attr.aria-label]="partner.name">
            <div class="partner-card__tools">
              <p-button
                styleClass="partner-card__tool partner-card__tool--download"
                icon="pi pi-download"
                severity="secondary"
                size="small"
                [rounded]="true"
                [ariaLabel]="lang.t('home.download')"
                [pTooltip]="lang.t('home.download')"
                tooltipPosition="top"
                (onClick)="download(partner)"
              />
              <p-button
                styleClass="partner-card__tool partner-card__tool--delete"
                icon="pi pi-trash"
                severity="secondary"
                size="small"
                [rounded]="true"
                [ariaLabel]="lang.t('users.delete')"
                [pTooltip]="lang.t('users.delete')"
                tooltipPosition="top"
                (onClick)="remove(partner)"
              />
            </div>
            <span class="visually-hidden">{{ partner.monogram }}</span>
          </article>
        }
      </div>
    </app-content-panel>
  }
</article>

<p-dialog
  [header]="lang.t(editingId() ? 'home.editPartner' : 'home.addPartner')"
  [visible]="editorOpen()"
  (visibleChange)="!$event && editorOpen.set(false)"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: 'min(32rem, 94vw)' }"
>
  <form class="form-grid" [formGroup]="form" (ngSubmit)="save()">
    <label class="field">
      <span class="field__label">{{ lang.t('home.partnerName') }}</span>
      <input pInputText [fluid]="true" formControlName="name" />
    </label>
    <label class="field">
      <span class="field__label">{{ lang.t('home.monogram') }}</span>
      <input pInputText [fluid]="true" formControlName="monogram" maxlength="2" />
    </label>
    <p-button type="submit" [label]="lang.t('common.save')" [loading]="saving()" [fluid]="true" />
  </form>
</p-dialog>

<app-confirm-dialog />
