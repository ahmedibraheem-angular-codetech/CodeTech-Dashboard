<article class="section-card">
  <div class="section-head">
    <h2>{{ lang.t('home.recentUsers') }}</h2>
  </div>
  <p-table styleClass="app-table" [value]="users()" dataKey="id">
    <ng-template #header>
      <tr>
        <th>{{ lang.t('users.name') }}</th>
        <th>{{ lang.t('users.email') }}</th>
        <th>{{ lang.t('users.status') }}</th>
      </tr>
    </ng-template>
    <ng-template #body let-user>
      <tr>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td><app-status-badge [status]="user.status" /></td>
      </tr>
    </ng-template>
  </p-table>
</article>
