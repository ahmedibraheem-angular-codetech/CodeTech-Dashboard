<article class="section-card">
  <div class="section-head">
    <div class="section-head__title">
      <h2>{{ lang.t('home.video') }}</h2>
      @if (name()) {
        <p-toggleswitch
          [ngModel]="enabled()"
          (ngModelChange)="toggle($event)"
          [attr.aria-label]="lang.t('home.video')"
        />
      }
    </div>
    @if (name()) {
      <div class="page-header__actions">
        <p-fileupload
          mode="basic"
          accept="video/*"
          chooseIcon="pi pi-upload"
          [chooseLabel]="lang.t('home.reupload')"
          [auto]="true"
          [customUpload]="true"
          [invalidFileTypeMessageSummary]="lang.t('home.invalidVideoSummary')"
          [invalidFileTypeMessageDetail]="lang.t('home.invalidVideoDetail')"
          (onSelect)="onSelected($event)"
        />
        <p-button
          icon="pi pi-trash"
          severity="danger"
          variant="outlined"
          [ariaLabel]="lang.t('home.deleteVideo')"
          [pTooltip]="lang.t('home.deleteVideo')"
          tooltipPosition="top"
          (onClick)="remove()"
        />
      </div>
    }
  </div>
  @if (name(); as videoName) {
    <div class="video-frame" [class.is-off]="!enabled()">
      <iframe
        class="video-frame__player"
        [src]="videoSrc"
        [title]="videoName"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        allowfullscreen
      ></iframe>
    </div>
  } @else {
    <app-section-empty
      [title]="lang.t('home.videoEmptyTitle')"
      [hint]="lang.t('home.videoEmptyHint')"
    >
      <p-fileupload
        mode="basic"
        accept="video/*"
        chooseIcon="pi pi-upload"
        [chooseLabel]="lang.t('home.videoUpload')"
        [auto]="true"
        [customUpload]="true"
        styleClass="section-empty__upload"
        [invalidFileTypeMessageSummary]="lang.t('home.invalidVideoSummary')"
        [invalidFileTypeMessageDetail]="lang.t('home.invalidVideoDetail')"
        (onSelect)="onSelected($event)"
      />
    </app-section-empty>
  }
</article>

<app-confirm-dialog />
