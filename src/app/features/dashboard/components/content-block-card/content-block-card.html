<article class="section-card">
  <div class="section-head">
    <h2>{{ block().title }}</h2>
    @if (filled()) {
      <p-button
        icon="pi pi-pencil"
        [label]="lang.t('home.edit')"
        severity="secondary"
        variant="outlined"
        (onClick)="open()"
      />
    }
  </div>
  @if (filled()) {
    <app-content-panel>
      <div class="story">
        <img class="story__visual" src="images/dashboardcodetech.svg" alt="" />
        <div class="story__text">
          <h3>{{ block().title }}</h3>
          <p>{{ block().body }}</p>
          <ul class="check-list">
            @for (point of block().points; track $index) {
              <li>
                <i class="pi pi-check" aria-hidden="true"></i><span>{{ point }}</span>
              </li>
            }
          </ul>
        </div>
      </div>
    </app-content-panel>
  } @else {
    <app-section-empty
      [title]="lang.t(kind() === 'about' ? 'home.aboutEmpty' : 'home.visionEmpty')"
      [hint]="lang.t(kind() === 'about' ? 'home.aboutEmptyHint' : 'home.visionEmptyHint')"
    >
      <p-button
        icon="pi pi-file"
        [label]="lang.t(kind() === 'about' ? 'home.aboutAdd' : 'home.visionAdd')"
        severity="secondary"
        variant="outlined"
        (onClick)="open()"
      />
    </app-section-empty>
  }
</article>

<p-dialog
  [header]="lang.t('home.edit')"
  [visible]="editorOpen()"
  (visibleChange)="!$event && editorOpen.set(false)"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: 'min(36rem, 94vw)' }"
>
  <form class="form-grid" [formGroup]="form" (ngSubmit)="save()">
    <label class="field">
      <span class="field__label">{{ lang.t('users.name') }}</span>
      <input pInputText [fluid]="true" formControlName="title" />
    </label>
    <label class="field">
      <span class="field__label">{{ lang.t('home.body') }}</span>
      <textarea pTextarea [fluid]="true" rows="4" formControlName="body"></textarea>
    </label>
    <label class="field">
      <span class="field__label">{{ lang.t('home.point') }} 1</span>
      <input pInputText [fluid]="true" formControlName="point1" />
    </label>
    <label class="field">
      <span class="field__label">{{ lang.t('home.point') }} 2</span>
      <input pInputText [fluid]="true" formControlName="point2" />
    </label>
    <label class="field">
      <span class="field__label">{{ lang.t('home.point') }} 3</span>
      <input pInputText [fluid]="true" formControlName="point3" />
    </label>
    <p-button type="submit" [label]="lang.t('common.save')" [loading]="saving()" [fluid]="true" />
  </form>
</p-dialog>
