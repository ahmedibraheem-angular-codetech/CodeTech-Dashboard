<article class="section-card">
  <div class="section-head">
    <h2>{{ block().title }}</h2>
    <p-button
      icon="pi pi-pencil"
      [label]="lang.t('home.edit')"
      severity="secondary"
      variant="outlined"
      (onClick)="open()"
    />
  </div>
  <div class="story">
    <div>
      <p>{{ block().body }}</p>
      <ul class="check-list">
        @for (point of block().points; track $index) {
          <li>
            <i class="pi pi-check-circle" aria-hidden="true"></i><span>{{ point }}</span>
          </li>
        }
      </ul>
    </div>
    <div class="monument" aria-hidden="true">
      <span class="monument__tower"></span>
      <span class="monument__glow"></span>
    </div>
  </div>
</article>

<p-dialog
  [header]="lang.t('home.edit')"
  [visible]="editorOpen()"
  (visibleChange)="!$event && editorOpen.set(false)"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: 'min(36rem, 94vw)' }"
>
  <form class="form-grid" [formGroup]="form" (ngSubmit)="save()">
    <label class="field">
      <span class="field__label">{{ lang.t('users.name') }}</span>
      <input pInputText [fluid]="true" formControlName="title" />
    </label>
    <label class="field">
      <span class="field__label">{{ lang.t('home.body') }}</span>
      <textarea pTextarea [fluid]="true" rows="4" formControlName="body"></textarea>
    </label>
    <label class="field">
      <span class="field__label">{{ lang.t('home.point') }} 1</span>
      <input pInputText [fluid]="true" formControlName="point1" />
    </label>
    <label class="field">
      <span class="field__label">{{ lang.t('home.point') }} 2</span>
      <input pInputText [fluid]="true" formControlName="point2" />
    </label>
    <label class="field">
      <span class="field__label">{{ lang.t('home.point') }} 3</span>
      <input pInputText [fluid]="true" formControlName="point3" />
    </label>
    <p-button type="submit" [label]="lang.t('common.save')" [loading]="saving()" [fluid]="true" />
  </form>
</p-dialog>
