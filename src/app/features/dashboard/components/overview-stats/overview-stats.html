<article class="section-card">
  <div class="section-head">
    <h2>{{ lang.t('home.overview') }}</h2>
    <a pButton severity="secondary" variant="outlined" routerLink="/users">
      <span pButtonLabel>{{ lang.t('home.viewAll') }}</span>
    </a>
  </div>
  <div class="row g-3">
    <div class="col-6 col-xl-3">
      <div class="settings-card">
        <strong>{{ partnerCount() }}</strong
        ><span class="muted">{{ lang.t('home.statPartners') }}</span>
      </div>
    </div>
    <div class="col-6 col-xl-3">
      <div class="settings-card">
        <strong>{{ userTotal() }}</strong
        ><span class="muted">{{ lang.t('home.statUsers') }}</span>
      </div>
    </div>
    <div class="col-6 col-xl-3">
      <div class="settings-card">
        <strong>{{ activeUsers() }}</strong
        ><span class="muted">{{ lang.t('home.statActive') }}</span>
      </div>
    </div>
    <div class="col-6 col-xl-3">
      <div class="settings-card">
        <strong>{{ contactRequests() }}</strong
        ><span class="muted">{{ lang.t('home.statRequests') }}</span>
      </div>
    </div>
  </div>
</article>
