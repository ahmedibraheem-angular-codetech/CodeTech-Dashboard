@if (status() === 'loading') {
  <app-state-view mode="loading" />
} @else if (status() === 'error') {
  <app-state-view mode="error" (retry)="reload()" />
} @else {
  <section class="page">
    <app-page-header [title]="lang.t('home.manage')" [subtitle]="lang.t('home.subtitle')" />

    <app-partners-section [partners]="partners()" (changed)="reload(true)" />

    <app-video-section [(enabled)]="videoEnabled" [(name)]="videoName" />

    @if (about(); as block) {
      <app-content-block-card kind="about" [block]="block" (blockSaved)="about.set($event)" />
    }
    @if (vision(); as block) {
      <app-content-block-card kind="vision" [block]="block" (blockSaved)="vision.set($event)" />
    }

    <app-overview-stats
      [partnerCount]="partners().length"
      [userTotal]="userTotal()"
      [activeUsers]="activeUsers()"
      [contactRequests]="contactRequests()"
    />

    <article class="section-card">
      <div class="section-head">
        <h2>{{ lang.t('home.activity') }}</h2>
      </div>
      <ul class="activity-list">
        @for (item of activity; track item.text) {
          <li>
            <span>{{ lang.t(item.text) }}</span>
            <time class="muted">{{ lang.t(item.time) }}</time>
          </li>
        }
      </ul>
    </article>

    <app-recent-users [users]="recentUsers()" />
  </section>
}
