<app-editor-shell
  [title]="lang.t(mode() === 'edit' ? 'project.edit' : 'project.add')"
  [mode]="mode()"
  [status]="status()"
  [saving]="saving()"
  [published]="draft().published"
  [steps]="wizardSteps()"
  [active]="step()"
  [passed]="passed()"
  [lastStep]="lastStep()"
  [locale]="locale()"
  [labels]="shellLabels()"
  panelId="project-panel"
  tabIdPrefix="project-tab"
  (saveDraft)="saveDraft()"
  (publishChange)="updatePublished($event)"
  (save)="finish()"
  (retry)="retry()"
  (stepChange)="select($event)"
  (next)="next()"
  (previous)="previous()"
  (localeChange)="useLocale($event)"
>
  @switch (stepId()) {
    @case ('about') {
      <app-project-about-step />
    }
    @case ('challenges') {
      <app-project-challenges-step />
    }
    @case ('solutions') {
      <app-project-solutions-step />
    }
    @case ('features') {
      <app-project-features-step />
    }
    @case ('results') {
      <app-project-results-step />
    }
    @case ('identity') {
      <app-project-identity-step />
    }
    @case ('seo') {
      <app-project-seo-step />
    }
  }
</app-editor-shell>
