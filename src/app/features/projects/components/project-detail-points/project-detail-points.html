<ul class="challenge-grid">
  @for (item of items(); track item.id) {
    @let art = visual(item);
    <li>
      <span>
        @if (text(item.title)) {
          <strong>{{ text(item.title) }}</strong>
        }
        @if (text(item.body)) {
          <small>{{ text(item.body) }}</small>
        }
      </span>
      <span class="detail-features__icon" aria-hidden="true">
        @if (art.image) {
          <img [src]="art.image" alt="" />
        } @else if (art.icon) {
          <i class="pi" [class]="art.icon"></i>
        } @else {
          <i class="pi pi-star"></i>
        }
      </span>
    </li>
  }
</ul>
