<section class="page knowledge-board">
  <app-page-header [title]="lang.t('nav.knowledge')" [subtitle]="subtitle()">
    <p-datepicker
      styleClass="knowledge-board__datepicker"
      inputStyleClass="knowledge-board__datepicker-input"
      panelStyleClass="knowledge-board__datepicker-panel"
      dateFormat="yy-mm-dd"
      dataType="string"
      iconDisplay="button"
      appendTo="body"
      [ngModel]="dateFilter()"
      (ngModelChange)="setDateFilter($event)"
      [showIcon]="true"
      [showOnFocus]="false"
      [showButtonBar]="true"
      [disabled]="state() === 'loading'"
      [placeholder]="lang.t('knowledge.filterByDate')"
      [ariaLabel]="lang.t('knowledge.filterByDate')"
      [iconAriaLabel]="lang.t('knowledge.filterByDate')"
    />
    <app-button
      *appHasPermission="'knowledge_center.create'"
      icon="pi pi-plus"
      iconPos="end"
      styleClass="knowledge-board__add"
      [label]="addLabel()"
      (clicked)="add()"
    />
  </app-page-header>

  <app-page-tabs [tabs]="tabs()" [value]="tab()" (valueChange)="setTab($event)" />

  @if (state() === 'loading') {
    <app-state-view mode="loading" />
  } @else if (state() === 'error') {
    <app-state-view mode="error" [message]="lang.t('knowledge.loadError')" (retry)="reload()" />
  } @else {
    <div [hidden]="tab() !== 'articles'">
      <app-knowledge-articles-panel
        [articles]="filteredArticles()"
        [categories]="categories()"
        [showEdit]="canUpdate()"
        [showDelete]="canDelete()"
        (view)="view($event)"
        (edit)="openEditor($event)"
        (remove)="removeArticle($event)"
        (toggleFeatured)="toggleFeatured($event)"
        (statusChange)="changeStatus($event)"
        (exported)="exported($event)"
      />
    </div>
    <div [hidden]="tab() !== 'categories'">
      <app-knowledge-categories-panel
        [categories]="filteredCategories()"
        [showEdit]="canUpdate()"
        [showDelete]="canDelete()"
        (edit)="openEditCategory($event)"
        (remove)="removeCategory($event)"
      />
    </div>
  }
</section>

<app-modal
  [visible]="editor() !== null"
  (visibleChange)="setEditorVisible($event)"
  [title]="editorTitle()"
  [icon]="editor() === 'edit' ? 'pi pi-pencil' : 'pi pi-th-large'"
  [saveLabel]="editorSaveLabel()"
  [saveIcon]="editor() === 'edit' ? 'pi pi-save' : 'pi pi-plus'"
  [saveIconPos]="editor() === 'edit' ? 'start' : 'end'"
  [cancelLabel]="lang.t('common.cancel')"
  [saving]="saving()"
  (save)="saveCategory()"
  (cancel)="closeEditor()"
>
  @if (editor() !== null) {
    <app-category-form
      [form]="categoryForm"
      labelKey="knowledge.categoryName"
      placeholderKey="knowledge.categoryNamePlaceholder"
      requiredKey="knowledge.required"
      publishedKey="knowledge.publishStatus"
      (submitted)="saveCategory()"
    />
  }
</app-modal>

<app-confirm-dialog />
