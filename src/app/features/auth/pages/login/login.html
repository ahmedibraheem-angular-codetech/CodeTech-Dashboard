<app-auth-shell>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>{{ lang.t('auth.loginTitle') }}</h1>

    <label class="field">
      <span class="field__label">{{ lang.t('auth.email') }}</span>
      <span class="field__control" [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid">
        <input id="email" type="email" formControlName="email" autocomplete="username" [attr.aria-invalid]="form.controls.email.invalid" />
        <i class="pi pi-envelope" aria-hidden="true"></i>
      </span>
      @if (form.controls.email.touched && form.controls.email.hasError('required')) {
        <span class="field__error">{{ lang.t('auth.emailRequired') }}</span>
      } @else if (form.controls.email.touched && form.controls.email.hasError('email')) {
        <span class="field__error">{{ lang.t('auth.emailInvalid') }}</span>
      }
    </label>

    <label class="field">
      <span class="field__label">{{ lang.t('auth.password') }}</span>
      <span class="field__control" [class.is-invalid]="credentialError() || (form.controls.password.touched && form.controls.password.invalid)">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          [placeholder]="lang.t('auth.passwordPlaceholder')"
          [attr.aria-invalid]="credentialError() || form.controls.password.invalid"
          [attr.aria-describedby]="credentialError() ? 'password-error' : null"
        />
        <button type="button" class="field__toggle" (click)="showPassword.set(!showPassword())" [attr.aria-label]="lang.t(showPassword() ? 'auth.hidePassword' : 'auth.showPassword')">
          <i [class]="showPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'" aria-hidden="true"></i>
        </button>
      </span>
      @if (credentialError()) {
        <span class="field__error" id="password-error"><i class="pi pi-times-circle" aria-hidden="true"></i>{{ lang.t('auth.invalidPassword') }}</span>
      } @else if (form.controls.password.touched && form.controls.password.hasError('required')) {
        <span class="field__error">{{ lang.t('auth.passwordRequired') }}</span>
      } @else if (form.controls.password.touched && form.controls.password.hasError('minlength')) {
        <span class="field__error">{{ lang.t('auth.passwordShort') }}</span>
      }
    </label>

    <div class="login-row">
      <button type="button" class="field__link" (click)="resetOpen.set(true)">{{ lang.t('auth.forgot') }}</button>
      <label class="remember">
        <span>{{ lang.t('auth.remember') }}</span>
        <input class="remember__input" type="checkbox" [checked]="remember()" (change)="onRemember($event)" />
      </label>
    </div>

    <button class="btn btn-auth" type="submit" [disabled]="submitting()">
      <span>{{ lang.t('auth.submit') }}</span>
      <i class="pi pi-angle-left" aria-hidden="true"></i>
    </button>
  </form>
</app-auth-shell>

<p-dialog [header]="lang.t('auth.forgotTitle')" [visible]="resetOpen()" (visibleChange)="resetOpen.set($event)" [modal]="true" [draggable]="false" [style]="{ width: 'min(28rem, 94vw)' }">
  @if (resetSent()) {
    <p>{{ lang.t('auth.forgotSent') }}</p>
  } @else {
    <form class="form-grid" [formGroup]="resetForm" (ngSubmit)="sendReset()">
      <p class="muted">{{ lang.t('auth.forgotHint') }}</p>
      <label class="field">
        <span class="field__label">{{ lang.t('auth.email') }}</span>
        <span class="field__control">
          <input type="email" formControlName="email" />
        </span>
      </label>
      <button class="btn btn-primary" type="submit">{{ lang.t('auth.send') }}</button>
    </form>
  }
</p-dialog>
