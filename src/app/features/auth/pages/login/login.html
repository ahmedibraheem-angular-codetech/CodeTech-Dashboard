<app-auth-shell>
  <app-login-form
    [form]="form"
    [submitting]="submitting()"
    [credentialError]="credentialError()"
    [(showPassword)]="showPassword"
    [(remember)]="remember"
    (forgot)="resetOpen.set(true)"
    (submitted)="submit()"
  />
</app-auth-shell>

<app-login-reset-dialog
  [(visible)]="resetOpen"
  [sent]="resetSent()"
  [form]="resetForm"
  (send)="sendReset()"
/>
