<section class="page faq-board">
  <app-page-header [title]="lang.t('nav.faq')" [subtitle]="lang.t('faq.subtitle')">
    <app-button
      icon="pi pi-plus"
      iconPos="end"
      styleClass="faq-board__add"
      [label]="lang.t('faq.add')"
      (clicked)="openCreate()"
    />
  </app-page-header>

  <app-page-tabs [tabs]="tabs()" [value]="tab()" (valueChange)="setTab($event)" />

  @if (state() === 'loading') {
    <app-state-view mode="loading" />
  } @else if (state() === 'error') {
    <app-state-view mode="error" [message]="lang.t('faq.loadError')" (retry)="reload()" />
  } @else {
    <div [hidden]="tab() !== 'questions'">
      <app-faq-questions-panel
        [items]="items()"
        [categories]="categories()"
        (edit)="openEdit($event)"
        (remove)="remove($event)"
        (publishedChange)="setPublished($event.item, $event.published)"
      />
    </div>
    <div [hidden]="tab() !== 'categories'">
      <app-faq-categories-panel
        [categories]="categories()"
        [items]="items()"
        (publishedChange)="setCategoryPublished($event.category, $event.published)"
      />
    </div>
  }
</section>

<app-modal
  [visible]="editor() !== null"
  (visibleChange)="setEditorVisible($event)"
  [title]="editorTitle()"
  [icon]="editor() === 'create' ? 'pi pi-plus' : 'pi pi-pencil'"
  [saveLabel]="lang.t('common.saveChanges')"
  [cancelLabel]="lang.t('common.cancel')"
  [saving]="saving()"
  (save)="save()"
  (cancel)="closeEditor()"
>
  <app-faq-editor-form [form]="form" [categoryOptions]="categoryOptions()" (submitted)="save()" />
</app-modal>

<app-confirm-dialog />
