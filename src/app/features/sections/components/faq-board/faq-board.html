<section class="page faq-board">
  <app-page-header [title]="pageTitle()" [subtitle]="pageSubtitle()">
    <app-button
      *appHasPermission="'help_support.create'"
      icon="pi pi-plus"
      iconPos="end"
      styleClass="faq-board__add"
      [label]="addLabel()"
      (clicked)="openCreate()"
    />
  </app-page-header>

  <app-page-tabs [tabs]="tabs()" [value]="tab()" (valueChange)="setTab($event)" />

  @if (state() === 'loading') {
    <app-state-view mode="loading" />
  } @else if (state() === 'error') {
    <app-state-view mode="error" [message]="lang.t('faq.loadError')" (retry)="reload()" />
  } @else {
    <div [hidden]="tab() !== 'questions'">
      <app-faq-questions-panel
        [items]="items()"
        [categories]="categories()"
        [showEdit]="canUpdate()"
        [showDelete]="canDelete()"
        [showPublish]="canUpdate()"
        (edit)="openEdit($event)"
        (remove)="remove($event)"
        (publishedChange)="setPublished($event.item, $event.published)"
      />
    </div>
    <div [hidden]="tab() !== 'categories'">
      <app-faq-categories-panel
        [categories]="categories()"
        [items]="items()"
        [showEdit]="canUpdate()"
        [showDelete]="canDelete()"
        [showPublish]="canUpdate()"
        (edit)="openEditCategory($event)"
        (remove)="removeCategory($event)"
        (publishedChange)="setCategoryPublished($event.category, $event.published)"
      />
    </div>
  }
</section>

<app-modal
  [visible]="editor() !== null"
  (visibleChange)="setEditorVisible($event)"
  [title]="editorTitle()"
  [icon]="editorIcon()"
  [saveLabel]="editorSaveLabel()"
  [saveIcon]="editorSaveIcon()"
  [saveIconPos]="editorSaveIconPos()"
  [cancelLabel]="lang.t('common.cancel')"
  [saving]="saving()"
  (save)="save()"
  (cancel)="closeEditor()"
>
  @if (editor() === 'create' || editor() === 'edit') {
    <app-faq-editor-form [form]="form" [categoryOptions]="categoryOptions()" (submitted)="save()" />
  } @else if (editor() === 'create-category' || editor() === 'edit-category') {
    <app-category-form
      [form]="categoryForm"
      labelKey="faq.categoryName"
      placeholderKey="faq.categoryNamePlaceholder"
      requiredKey="faq.required"
      publishedKey="faq.publishStatus"
      (submitted)="save()"
    />
  }
</app-modal>

<app-confirm-dialog />
