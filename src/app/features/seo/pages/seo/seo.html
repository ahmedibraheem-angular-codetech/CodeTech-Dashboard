<section class="page seo-page">
  <app-page-header [title]="title()" [subtitle]="lang.t('seo.subtitle')">
    <p-button
      class="seo-save"
      styleClass="seo-btn"
      icon="pi pi-save"
      iconPos="right"
      [label]="lang.t('seo.save')"
      (onClick)="save()"
    />
    <p-button
      class="seo-revert"
      styleClass="seo-btn"
      icon="pi pi-undo"
      iconPos="right"
      severity="secondary"
      [outlined]="true"
      [label]="lang.t('seo.revert')"
      [disabled]="!dirty()"
      (onClick)="revert()"
    />
  </app-page-header>

  <app-page-tabs [tabs]="pages" [value]="active()" (valueChange)="select($event)" />

  <!-- First card sits on the right in RTL, matching the design: SEO beside the sidebar. -->
  <div class="seo-grid">
    <app-meta-card [pageId]="active()" />
    <app-thumbnail-card [pageId]="active()" />
  </div>
</section>
