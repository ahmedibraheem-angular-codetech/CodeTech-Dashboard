<section class="editor-section editor-section--soft">
  <header class="editor-section__head">
    <h2>{{ editor.copy('service.features') }}</h2>
    <span class="icon-badge" aria-hidden="true"><i class="pi pi-star"></i></span>
  </header>
  <div class="editor-section__body">
    @for (item of editor.draft().features; track item.id; let index = $index) {
      <app-feature-card
        [label]="editor.copy('service.featureItem') + ' ' + (index + 1)"
        [title]="editor.text(item.title)"
        [titleLabel]="editor.copy('service.featureTitle')"
        [titlePlaceholder]="editor.copy('service.featureTitlePh')"
        [body]="editor.text(item.body)"
        [bodyLabel]="editor.copy('service.featureBody')"
        [bodyPlaceholder]="editor.copy('service.featureBodyPh')"
        [iconLabel]="editor.copy('service.featureImage')"
        [imageName]="item.imageName"
        [imageUrl]="item.imageUrl"
        [locale]="editor.locale()"
        [uploadKeyPrefix]="uploadPrefix"
        [clearable]="true"
        [actions]="false"
        [removeDisabled]="editor.draft().features.length === 1"
        [removeLabel]="editor.copy('service.removeItem')"
        removeIcon="pi-times"
        (titleChange)="editor.setPoint('features', index, 'title', $event)"
        (bodyChange)="editor.setPoint('features', index, 'body', $event)"
        (imageChange)="editor.setPointImage('features', index, $event)"
        (imageCleared)="editor.clearPointImage('features', index)"
        (removed)="editor.removePoint('features', index)"
      />
    }
    <button type="button" class="add-row" (click)="editor.addPoint('features')">
      <span class="add-row__mark" aria-hidden="true"><i class="pi pi-plus"></i></span>
      {{ editor.copy('service.addFeature') }}
    </button>
  </div>
</section>
