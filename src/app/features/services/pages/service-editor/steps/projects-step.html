<section class="editor-section editor-section--soft">
  <header class="editor-section__head">
    <h2>{{ editor.copy('service.projects') }}</h2>
    <span class="icon-badge" aria-hidden="true"><i class="pi pi-briefcase"></i></span>
  </header>
  <div class="editor-section__body">
    <p class="service-projects-hint">{{ editor.copy('service.projectsHint') }}</p>
    @switch (editor.projectsStatus()) {
      @case ('loading') {
        <app-state-view mode="loading" [message]="editor.copy('common.loading')" />
      }
      @case ('error') {
        <app-state-view
          mode="error"
          [message]="editor.copy('common.error')"
          (retry)="editor.loadProjects()"
        />
      }
      @default {
        @if (editor.projects().length === 0) {
          <app-state-view mode="empty" [message]="editor.copy('service.projectsEmpty')" />
        } @else {
          <div class="service-projects-grid">
            @for (project of editor.projects(); track project.id) {
              <app-service-project-card
                [title]="editor.text(project.name) || project.name.ar"
                [summary]="editor.text(project.summary) || project.summary.ar"
                [coverUrl]="project.coverUrl"
                [selected]="editor.projectSelected(project.id)"
                [toggleLabel]="editor.copy('service.projectToggle')"
                (selectedChange)="editor.setProject(project.id, $event)"
              />
            }
          </div>
        }
      }
    }
  </div>
</section>
