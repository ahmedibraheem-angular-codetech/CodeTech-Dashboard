<app-editor-shell
  [title]="lang.t(mode() === 'edit' ? 'service.edit' : 'service.add')"
  [mode]="mode()"
  [status]="status()"
  [saving]="saving()"
  [published]="draft().published"
  [steps]="wizardSteps()"
  [active]="step()"
  [passed]="passed()"
  [lastStep]="lastStep()"
  [locale]="locale()"
  [labels]="shellLabels()"
  panelId="service-panel"
  tabIdPrefix="service-tab"
  (saveDraft)="saveDraft()"
  (publishChange)="updatePublished($event)"
  (save)="finish()"
  (retry)="retry()"
  (stepChange)="select($event)"
  (next)="next()"
  (previous)="previous()"
  (localeChange)="useLocale($event)"
>
  @switch (stepId()) {
    @case ('why') {
      <app-service-why-step />
    }
    @case ('solutions') {
      <app-service-solutions-step />
    }
    @case ('stages') {
      <app-service-stages-step />
    }
    @case ('features') {
      <app-service-features-step />
    }
    @case ('projects') {
      <app-service-projects-step />
    }
    @case ('sectors') {
      <app-service-sectors-step />
    }
    @case ('faq') {
      <app-service-faq-step />
    }
  }
</app-editor-shell>
