<div class="service-icons" role="listbox" [attr.aria-label]="groupLabel()">
  @for (icon of options(); track icon) {
    <button
      type="button"
      class="service-icons__item"
      role="option"
      [class.is-selected]="icon === value()"
      [attr.aria-selected]="icon === value()"
      [attr.aria-label]="optionLabel() + ': ' + icon"
      [attr.data-icon]="icon"
      (click)="picked.emit(icon)"
    >
      <i [class]="'pi ' + icon" aria-hidden="true"></i>
    </button>
  }
</div>
