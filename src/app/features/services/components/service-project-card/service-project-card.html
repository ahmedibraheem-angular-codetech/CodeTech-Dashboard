<article class="service-project" [class.is-selected]="selected()">
  <div class="service-project__media">
    @if (coverUrl()) {
      <img [src]="coverUrl()" alt="" />
    }
    <span class="service-project__toggle">
      <p-toggleswitch
        [ngModel]="selected()"
        (ngModelChange)="selectedChange.emit($event)"
        [ariaLabel]="toggleLabel() ? toggleLabel() + ': ' + title() : title()"
      />
    </span>
  </div>
  <h3>{{ title() }}</h3>
  <p>{{ summary() }}</p>
</article>
