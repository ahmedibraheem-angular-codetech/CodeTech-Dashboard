<article class="service-card">
  <div class="service-card__top">
    <span class="service-card__icon" aria-hidden="true">
      <i [class]="iconClass()"></i>
    </span>
    <span class="service-card__actions">
      <app-button
        icon="pi pi-pencil"
        variant="primary"
        [outlined]="true"
        [rounded]="true"
        styleClass="service-card__action"
        [ariaLabel]="editLabel()"
        (clicked)="editRequested.emit()"
      />
      <app-button
        icon="pi pi-trash"
        variant="danger"
        [outlined]="true"
        [rounded]="true"
        styleClass="service-card__action"
        [ariaLabel]="deleteLabel()"
        (clicked)="deleteRequested.emit()"
      />
    </span>
  </div>
  <div class="service-card__head">
    <h2>{{ title() }}</h2>
    <p-toggleswitch
      [ngModel]="published()"
      (ngModelChange)="publishedChange.emit($event)"
      [ariaLabel]="toggleLabel() ? toggleLabel() + ': ' + title() : title()"
    />
  </div>
  <p class="service-card__description">{{ description() }}</p>
</article>
