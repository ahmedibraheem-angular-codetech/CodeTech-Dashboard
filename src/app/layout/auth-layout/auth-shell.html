<div class="auth-shell">
  <div class="auth-frame">
    <section class="auth-brand">
      <div class="auth-brand__top">
        <button type="button" class="lang-pill" (click)="lang.toggle()">
          <span>{{ lang.language() === 'ar' ? 'العربية' : 'English' }}</span>
          @if (lang.language() === 'ar') {
            <img class="lang-pill__flag" src="images/flag-sa.svg" alt="" aria-hidden="true" />
          } @else {
            <span class="lang-pill__badge">EN</span>
          }
        </button>
        <app-brand-logo tone="light" />
      </div>
      <svg
        class="auth-mark"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="533"
        height="313"
        viewBox="0 0 533 313"
        fill="none"
      >
        <path
          d="M412.903 0H241.382C237.087 0 233.577 3.55793 233.577 7.95197V112.342C233.577 116.718 237.052 120.276 241.347 120.294L408.363 121.023C412.658 121.041 416.133 124.599 416.133 128.975V496.989C416.133 501.383 412.641 504.941 408.328 504.941H124.672C120.359 504.941 116.867 501.383 116.867 496.989V320.961C116.867 316.567 120.359 313.009 124.672 313.009H225.772C230.085 313.009 233.577 309.451 233.577 305.057V123.549C233.577 121.45 232.774 119.44 231.325 117.945L119.015 2.36602C117.548 0.853903 115.54 0 113.462 0H7.80511C3.49222 0 0 3.55793 0 7.95197V112.359C0 116.736 3.4573 120.276 7.75273 120.311L109.097 121.005C113.392 121.041 116.85 124.581 116.85 128.957V305.039C116.85 309.433 113.357 312.991 109.045 312.991H7.80511C3.49222 312.991 0 316.549 0 320.943V503.643C0 505.76 0.820671 507.77 2.2874 509.264L114.58 623.669C116.046 625.164 118.037 626 120.097 626H412.903C414.98 626 416.954 625.164 418.42 623.669L530.713 509.264C532.179 507.77 533 505.742 533 503.643V122.357C533 120.24 532.179 118.23 530.713 116.736L418.42 2.33044C416.971 0.836114 414.98 0 412.903 0Z"
          fill="white"
          fill-opacity="0.1"
        />
      </svg>
    </section>
    <section class="auth-panel">
      <div class="auth-card" [attr.dir]="lang.language() === 'ar' ? 'rtl' : 'ltr'">
        <ng-content />
      </div>
    </section>
  </div>
</div>
