<header class="topbar">
  <div class="topbar__trail">
    <p-button
      icon="pi pi-bars"
      severity="secondary"
      [text]="true"
      [rounded]="true"
      [ariaLabel]="lang.t('header.toggleSidebar')"
      [pTooltip]="lang.t('header.toggleSidebar')"
      tooltipPosition="bottom"
      (onClick)="layout.toggleSidebar()"
    />
    <app-breadcrumbs />
  </div>
  <div class="topbar__tools">
    <p-button
      [icon]="theme.theme() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"
      severity="secondary"
      [text]="true"
      [rounded]="true"
      [ariaLabel]="lang.t('header.toggleTheme')"
      [pTooltip]="lang.t('header.toggleTheme')"
      tooltipPosition="bottom"
      (onClick)="theme.toggle()"
    />
    <!-- Directive form: aria-expanded has to sit on the native <button>, not on <p-button>. -->
    <button
      pButton
      type="button"
      severity="secondary"
      [text]="true"
      [rounded]="true"
      [attr.aria-label]="lang.t('header.search')"
      [attr.aria-expanded]="searchOpen()"
      [pTooltip]="lang.t('header.search')"
      tooltipPosition="bottom"
      (click)="searchOpen.set(!searchOpen())"
    >
      <span pButtonIcon class="pi pi-search" aria-hidden="true"></span>
    </button>
    <p-button
      icon="pi pi-bell"
      severity="secondary"
      [text]="true"
      [rounded]="true"
      [ariaLabel]="lang.t('header.notifications')"
      [pTooltip]="lang.t('header.notifications')"
      tooltipPosition="bottom"
      (onClick)="openNotifications($event)"
    >
      @if (unread()) {
        <span class="topbar__dot"></span>
      }
    </p-button>
    <button
      type="button"
      class="user-chip"
      aria-haspopup="menu"
      [attr.aria-label]="auth.session()?.name || lang.t('header.profile')"
      (click)="openUserMenu($event)"
    >
      <span class="avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="user-chip__name">{{ shortName() }}</span>
      <span class="presence" aria-hidden="true"></span>
    </button>
  </div>
</header>

@if (searchOpen()) {
  <form class="search-pop" (ngSubmit)="search()">
    <label class="visually-hidden" for="global-search">{{ lang.t('header.search') }}</label>
    <input
      pInputText
      id="global-search"
      [placeholder]="lang.t('header.searchPlaceholder')"
      [ngModel]="query()"
      (ngModelChange)="query.set($event)"
      name="q"
    />
    <p-button type="submit" [label]="lang.t('header.search')" />
  </form>
}

<p-popover #notifications>
  <div class="note-list">
    @for (notice of notices(); track notice.id) {
      <button
        type="button"
        class="note"
        [class.is-unread]="!notice.read"
        (click)="markRead(notice.id)"
      >
        <strong>{{ lang.t(notice.titleKey) }}</strong>
        <span class="muted">{{ lang.t(notice.timeKey) }}</span>
      </button>
    } @empty {
      <p class="muted">{{ lang.t('header.noNotifications') }}</p>
    }
  </div>
</p-popover>

<p-menu #userMenu [popup]="true" [model]="menuItems()" appendTo="body" />
