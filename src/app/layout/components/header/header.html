<header class="topbar">
  <div class="topbar__trail">
    <app-button
      icon="pi pi-bars"
      variant="outlined"
      styleClass="topbar__btn"
      [ariaLabel]="lang.t('header.toggleSidebar')"
      [pTooltip]="lang.t('header.toggleSidebar')"
      tooltipPosition="bottom"
      (clicked)="layout.toggleSidebar()"
    />
    <app-breadcrumbs />
  </div>
  <div class="topbar__tools">
    <app-button
      [icon]="layout.zoomDirection() === 'in' ? 'pi pi-search-plus' : 'pi pi-search-minus'"
      variant="outlined"
      styleClass="topbar__btn"
      [ariaLabel]="zoomLabel()"
      [pTooltip]="zoomLabel()"
      tooltipPosition="bottom"
      (clicked)="layout.cycleZoom()"
    />
    <p-button
      icon="pi pi-bell"
      severity="secondary"
      variant="outlined"
      styleClass="topbar__btn"
      [ariaLabel]="lang.t('header.notifications')"
      [pTooltip]="lang.t('header.notifications')"
      tooltipPosition="bottom"
      (onClick)="openNotifications($event)"
    >
      @if (unread()) {
        <span class="topbar__dot"></span>
      }
    </p-button>
    <app-button
      icon="pi pi-globe"
      variant="outlined"
      styleClass="topbar__btn topbar__lang"
      [label]="lang.t('header.languageName')"
      [ariaLabel]="lang.t('header.language')"
      (clicked)="lang.toggle()"
    />
    <a
      class="user-chip"
      routerLink="/profile"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
      [attr.aria-label]="lang.t('header.profile')"
    >
      <app-user-avatar [size]="48" />
    </a>
  </div>
</header>

<p-popover #notifications>
  <div class="note-list">
    @for (notice of notices(); track notice.id) {
      <button
        type="button"
        class="note"
        [class.is-unread]="!notice.read"
        (click)="markRead(notice.id)"
      >
        <strong>{{ lang.t(notice.titleKey) }}</strong>
        <span class="muted">{{ lang.t(notice.timeKey) }}</span>
      </button>
    } @empty {
      <p class="muted">{{ lang.t('header.noNotifications') }}</p>
    }
  </div>
</p-popover>
