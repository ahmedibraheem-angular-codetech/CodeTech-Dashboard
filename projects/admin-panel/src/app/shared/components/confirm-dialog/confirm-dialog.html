<p-dialog
  [header]="title()"
  [visible]="visible()"
  (visibleChange)="onVisible($event)"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: 'min(28rem, 94vw)' }"
>
  <p>{{ message() }}</p>
  <ng-template #footer>
    <button type="button" class="btn btn-ghost" (click)="cancel()">{{ cancelLabel() }}</button>
    <button type="button" class="btn" [class.btn-danger]="danger()" [class.btn-primary]="!danger()" (click)="confirm()">
      {{ confirmLabel() }}
    </button>
  </ng-template>
</p-dialog>
