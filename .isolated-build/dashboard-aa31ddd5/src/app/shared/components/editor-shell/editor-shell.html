<section class="page">
  <app-page-header [title]="title()">
    @if (mode() === 'edit') {
      <app-button
        class="editor-draft"
        styleClass="editor-draft__button"
        icon="pi pi-file"
        iconPos="right"
        variant="outlined"
        [disabled]="saving()"
        [label]="labels().saveDraft"
        (clicked)="saveDraft.emit()"
      />
      <app-button
        class="editor-draft"
        styleClass="editor-draft__button"
        variant="outlined"
        [disabled]="saving()"
        [label]="published() ? labels().unpublish : labels().publish"
        (clicked)="publishChange.emit(!published())"
      />
      <app-button
        [disabled]="saving()"
        [loading]="saving()"
        [label]="labels().save"
        (clicked)="save.emit()"
      />
    } @else {
      <app-button
        class="editor-draft"
        styleClass="editor-draft__button"
        icon="pi pi-file"
        iconPos="right"
        variant="outlined"
        [disabled]="saving()"
        [loading]="saving()"
        [label]="labels().saveDraft"
        (clicked)="saveDraft.emit()"
      />
    }
  </app-page-header>

  @if (status() === 'loading') {
    <app-state-view mode="loading" [message]="labels().loading" />
  } @else if (status() === 'missing') {
    <app-state-view mode="empty" [message]="labels().missing" />
  } @else if (status() === 'error') {
    <app-state-view mode="error" [message]="labels().error" (retry)="retry.emit()" />
  } @else {
    @if (mode() === 'edit') {
      <app-page-tabs
        [tabs]="editorTabs()"
        [value]="steps()[active()]?.id"
        [disabled]="saving()"
        (valueChange)="chooseTab($event)"
      />
    } @else {
      <app-wizard-stepper
        [steps]="steps()"
        [active]="active()"
        [passed]="passed()"
        (picked)="stepChange.emit($event)"
      />
    }

    <div class="editor-locale">
      <app-locale-switch [value]="locale()" (picked)="localeChange.emit($event)" />
    </div>

    <div
      class="editor-card"
      [id]="panelId()"
      role="tabpanel"
      [attr.dir]="locale() === 'ar' ? 'rtl' : 'ltr'"
    >
      <ng-content />
    </div>

    @if (mode() === 'create') {
      <footer class="editor-footer">
        @if (lastStep()) {
          <app-button
            class="editor-next"
            styleClass="editor-nav editor-nav--next"
            [disabled]="saving()"
            [loading]="saving()"
            [label]="labels().finish"
            (clicked)="save.emit()"
          />
        } @else {
          <app-button
            class="editor-next"
            styleClass="editor-nav editor-nav--next"
            [disabled]="saving()"
            [loading]="saving()"
            [label]="labels().next"
            (clicked)="next.emit()"
          />
        }
        <app-button
          class="editor-back"
          styleClass="editor-nav editor-nav--back"
          variant="outlined"
          [disabled]="saving()"
          [label]="labels().previous"
          (clicked)="previous.emit()"
        />
      </footer>
    }
  }
</section>
