<article class="product-card" [class.is-revealed]="revealed()">
  <div class="product-card__media">
    @if (imageUrl()) {
      <img [src]="imageUrl()" alt="" />
    }
    <span class="product-card__actions">
      @if (showDelete()) {
        <app-button
          type="button"
          icon="pi pi-trash"
          [rounded]="true"
          variant="ghost"
          styleClass="product-card__action product-card__action--danger"
          [ariaLabel]="deleteLabel()"
          (clicked)="deleteRequested.emit()"
        />
      }
      @if (showEdit()) {
        <app-button
          type="button"
          icon="pi pi-pencil"
          [rounded]="true"
          variant="ghost"
          styleClass="product-card__action product-card__action--edit"
          [ariaLabel]="editLabel()"
          (clicked)="editRequested.emit()"
        />
      }
      <app-button
        type="button"
        icon="pi pi-eye"
        [rounded]="true"
        variant="ghost"
        styleClass="product-card__action product-card__action--view"
        [ariaLabel]="viewLabel()"
        (clicked)="viewRequested.emit()"
      />
    </span>
    <app-button
      class="product-card__more"
      type="button"
      icon="pi pi-ellipsis-h"
      [rounded]="true"
      variant="ghost"
      styleClass="product-card__more-button"
      [ariaLabel]="moreLabel()"
      (clicked)="moreRequested.emit($event)"
    />
  </div>

  <div class="product-card__panel">
    <h2>
      <button type="button" (click)="viewRequested.emit()">{{ title() }}</button>
    </h2>
    <p>{{ summary() }}</p>
    <div class="feature-grid">
      @for (feature of features(); track feature.id; let featureIndex = $index) {
        <article>
          <span class="feature-icon" aria-hidden="true">
            @switch (featureIndex) {
              @case (0) {
                <svg viewBox="0 0 24 24">
                  <path
                    d="M10.2 3.8h3.6l.4 1.8c.6.2 1.1.5 1.6.9l1.7-.9 1.8 1.8-.9 1.7c.4.5.7 1 .9 1.6l1.8.4v3.6l-1.8.4c-.2.6-.5 1.1-.9 1.6l.9 1.7-1.8 1.8-1.7-.9c-.5.4-1 .7-1.6.9l-.4 1.8h-3.6l-.4-1.8a6 6 0 0 1-1.6-.9l-1.7.9-1.8-1.8.9-1.7a6 6 0 0 1-.9-1.6l-1.8-.4V9.3l1.8-.4c.2-.6.5-1.1.9-1.6l-.9-1.7 1.8-1.8 1.7.9c.5-.4 1-.7 1.6-.9l.4-1.8z"
                  />
                  <circle cx="12" cy="12" r="2.2" />
                </svg>
              }
              @case (1) {
                <svg viewBox="0 0 24 24">
                  <rect x="6" y="4.5" width="12" height="15" rx="2" />
                  <path d="M9 9h6M9 12.5h6M9 16h4" />
                </svg>
              }
              @case (2) {
                <svg viewBox="0 0 24 24">
                  <circle cx="7" cy="8" r="2" />
                  <circle cx="17" cy="8" r="2" />
                  <circle cx="12" cy="16" r="2" />
                  <path d="M9 8h6M8.2 9.6l2.4 4.6M15.8 9.6l-2.4 4.6" />
                </svg>
              }
              @default {
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="7" />
                  <path d="M12 8.5V12l2.5 2" />
                </svg>
              }
            }
          </span>
          <div>
            <strong>{{ feature.title }}</strong>
            <span>{{ feature.body }}</span>
          </div>
        </article>
      }
    </div>
  </div>
</article>
