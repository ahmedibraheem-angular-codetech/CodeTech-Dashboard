<p-dialog
  styleClass="app-confirm"
  [visible]="visible()"
  (visibleChange)="onVisible($event)"
  appendTo="body"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [showHeader]="false"
  [closable]="false"
  [dismissableMask]="false"
  [attr.aria-labelledby]="titleId"
>
  <div class="app-confirm__body">
    @if (danger()) {
      <span class="app-confirm__badge" aria-hidden="true"><i class="pi pi-trash"></i></span>
    }
    <h2 class="app-confirm__title" [id]="titleId">{{ title() }}</h2>
    <p class="app-confirm__message">{{ message() }}</p>
  </div>
  <ng-template #footer>
    <app-button
      class="app-confirm__action"
      [styleClass]="
        danger() ? 'app-confirm__action app-confirm__action--danger' : 'app-confirm__action'
      "
      [label]="confirmLabel()"
      [variant]="danger() ? 'danger' : 'primary'"
      (clicked)="confirm()"
    />
    <app-button
      class="app-confirm__action"
      styleClass="app-confirm__action app-confirm__action--back"
      [label]="cancelLabel()"
      variant="outlined"
      (clicked)="cancel()"
    />
  </ng-template>
</p-dialog>
