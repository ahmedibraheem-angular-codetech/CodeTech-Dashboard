<app-editor-shell
  [title]="lang.t(mode() === 'edit' ? 'product.edit' : 'product.add')"
  [mode]="mode()"
  [status]="status()"
  [saving]="saving()"
  [published]="draft().published"
  [steps]="wizardSteps()"
  [active]="step()"
  [passed]="passed()"
  [lastStep]="lastStep()"
  [locale]="locale()"
  [labels]="shellLabels()"
  panelId="product-panel"
  tabIdPrefix="product-tab"
  (saveDraft)="saveDraft()"
  (publishChange)="updatePublished($event)"
  (save)="finish()"
  (retry)="retry()"
  (stepChange)="select($event)"
  (next)="next()"
  (previous)="previous()"
  (localeChange)="useLocale($event)"
>
  @switch (stepId()) {
    @case ('info') {
      <app-info-step />
    }
    @case ('sectors') {
      <app-sectors-step />
    }
    @case ('offer') {
      <app-offer-step />
    }
    @case ('tools') {
      <app-tools-step />
    }
    @case ('units') {
      <app-units-step />
    }
    @case ('identity') {
      <app-identity-step />
    }
    @case ('faq') {
      <app-faq-step />
    }
    @case ('seo') {
      <app-seo-step />
    }
  }
</app-editor-shell>
