<form class="forgot-form" [formGroup]="form()" (ngSubmit)="onSubmit()" novalidate>
  <app-button
    styleClass="back-btn"
    type="button"
    icon="pi pi-angle-left"
    variant="secondary"
    [ariaLabel]="lang.t('auth.back')"
    (clicked)="back.emit()"
  />

  <h1>{{ lang.t('auth.forgotTitle') }}</h1>

  <label class="field">
    <span class="field__label">{{ lang.t('auth.email') }}</span>
    <p-iconfield>
      <input
        pInputText
        [fluid]="true"
        id="forgot-email"
        type="email"
        formControlName="email"
        autocomplete="username"
        [invalid]="emailShowError()"
        [attr.aria-invalid]="form().controls.email.invalid"
        [attr.aria-describedby]="emailShowError() ? 'forgot-email-error' : null"
      />
      <p-inputicon class="pi pi-envelope" />
    </p-iconfield>
    @if (emailShowError() && form().controls.email.hasError('required')) {
      <app-field-error id="forgot-email-error" [icon]="true">{{
        lang.t('auth.emailRequired')
      }}</app-field-error>
    } @else if (emailShowError() && form().controls.email.hasError('email')) {
      <app-field-error id="forgot-email-error" [icon]="true">{{
        lang.t('auth.emailInvalid')
      }}</app-field-error>
    }
  </label>

  <app-button
    styleClass="auth-submit"
    type="submit"
    icon="pi pi-angle-double-left"
    iconPos="right"
    size="large"
    [fluid]="true"
    [label]="lang.t('auth.verifySubmit')"
    [loading]="submitting()"
    [disabled]="form().invalid"
  />
</form>
