<section class="editor-section editor-section--soft">
  <header class="editor-section__head">
    <h2>{{ editor.copy('service.solutions') }}</h2>
    <span class="icon-badge" aria-hidden="true"><i class="pi pi-check-circle"></i></span>
  </header>
  <div class="editor-section__body">
    @for (item of editor.draft().solutions; track item.id; let index = $index) {
      <app-feature-card
        [label]="editor.copy('service.solutionItem') + ' ' + (index + 1)"
        [title]="editor.text(item.title)"
        [titleLabel]="editor.copy('service.solutionTitle')"
        [titlePlaceholder]="editor.copy('service.solutionTitlePh')"
        [body]="editor.text(item.body)"
        [bodyLabel]="editor.copy('service.solutionBody')"
        [bodyPlaceholder]="editor.copy('service.solutionBodyPh')"
        [iconLabel]="editor.copy('service.uploadIcon')"
        [imageName]="item.imageName"
        [imageUrl]="item.imageUrl"
        [locale]="editor.locale()"
        [uploadKeyPrefix]="uploadPrefix"
        [clearable]="true"
        [removeDisabled]="editor.draft().solutions.length === 1"
        [removeLabel]="editor.copy('service.removeItem')"
        removeIcon="pi-times"
        (titleChange)="editor.setPoint('solutions', index, 'title', $event)"
        (bodyChange)="editor.setPoint('solutions', index, 'body', $event)"
        (imageChange)="editor.setPointImage('solutions', index, $event)"
        (imageCleared)="editor.clearPointImage('solutions', index)"
        (removed)="editor.removePoint('solutions', index)"
      />
    }
    <button type="button" class="add-row" (click)="editor.addPoint('solutions')">
      <span class="add-row__mark" aria-hidden="true"><i class="pi pi-plus"></i></span>
      {{ editor.copy('service.addSolution') }}
    </button>
  </div>
</section>
