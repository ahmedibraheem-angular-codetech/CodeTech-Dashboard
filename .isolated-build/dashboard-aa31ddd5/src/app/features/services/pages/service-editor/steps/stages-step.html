<section class="editor-section editor-section--soft">
  <header class="editor-section__head">
    <h2>{{ editor.copy('service.stages') }}</h2>
    <span class="icon-badge" aria-hidden="true"><i class="pi pi-sitemap"></i></span>
  </header>
  <div class="editor-section__body">
    @for (item of editor.draft().stages; track item.id; let index = $index) {
      <app-feature-card
        [label]="editor.stageLabel(index)"
        [title]="editor.text(item.title)"
        [titleLabel]="editor.copy('service.stageTitle')"
        [titlePlaceholder]="editor.copy('service.stageTitlePh')"
        [body]="editor.text(item.body)"
        [bodyLabel]="editor.copy('service.stageBody')"
        [bodyPlaceholder]="editor.copy('service.stageBodyPh')"
        [iconLabel]="editor.copy('service.stageImage')"
        [imageName]="item.imageName"
        [imageUrl]="item.imageUrl"
        [locale]="editor.locale()"
        [uploadKeyPrefix]="uploadPrefix"
        [clearable]="true"
        [actions]="false"
        [removeDisabled]="editor.draft().stages.length === 1"
        [removeLabel]="editor.copy('service.removeItem')"
        removeIcon="pi-times"
        (titleChange)="editor.setPoint('stages', index, 'title', $event)"
        (bodyChange)="editor.setPoint('stages', index, 'body', $event)"
        (imageChange)="editor.setPointImage('stages', index, $event)"
        (imageCleared)="editor.clearPointImage('stages', index)"
        (removed)="editor.removePoint('stages', index)"
      />
    }
    <button type="button" class="add-row" (click)="editor.addPoint('stages')">
      <span class="add-row__mark" aria-hidden="true"><i class="pi pi-plus"></i></span>
      {{ editor.copy('service.addStage') }}
    </button>
  </div>
</section>
