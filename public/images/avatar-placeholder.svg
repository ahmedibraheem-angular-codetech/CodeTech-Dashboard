<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Profile placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe6f7"/>
      <stop offset="1" stop-color="#9ec9ea"/>
    </linearGradient>
    <clipPath id="frame"><rect width="200" height="200"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <!-- shirt -->
    <path d="M18 200c4-34 30-52 82-52s78 18 82 52z" fill="#5fb3a6"/>
    <path d="M70 156l30 22 30-22" fill="none" stroke="#3f8f84" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="58" cy="182" r="5" fill="#f4c9a6" opacity=".7"/>
    <circle cx="146" cy="176" r="5" fill="#f2b6c4" opacity=".8"/>
    <circle cx="120" cy="190" r="4" fill="#f4c9a6" opacity=".7"/>
    <!-- neck -->
    <path d="M84 128h32v26a16 16 0 0 1-32 0z" fill="#d9a07a"/>
    <!-- hair back -->
    <g fill="#5a3418">
      <circle cx="58" cy="78" r="16"/><circle cx="72" cy="56" r="18"/><circle cx="96" cy="46" r="19"/>
      <circle cx="122" cy="48" r="19"/><circle cx="144" cy="64" r="17"/><circle cx="148" cy="88" r="14"/>
      <circle cx="52" cy="100" r="11"/>
    </g>
    <!-- face -->
    <ellipse cx="100" cy="100" rx="40" ry="46" fill="#e8b48c"/>
    <!-- beard -->
    <path d="M62 104c2 34 18 50 38 50s36-16 38-50c-6 12-14 18-22 20-10-6-22-6-32 0-8-2-16-8-22-20z" fill="#6b3f1d"/>
    <path d="M86 130c8 5 20 5 28 0" fill="none" stroke="#e8b48c" stroke-width="5" stroke-linecap="round"/>
    <!-- hair front -->
    <path d="M60 86c4-24 20-34 40-34s36 10 40 34c-10-12-24-18-40-18S70 74 60 86z" fill="#5a3418"/>
    <!-- glasses -->
    <g fill="#fff" fill-opacity=".35" stroke="#1f2937" stroke-width="4">
      <rect x="66" y="88" width="30" height="24" rx="10"/>
      <rect x="104" y="88" width="30" height="24" rx="10"/>
    </g>
    <path d="M96 99h8" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
    <circle cx="81" cy="100" r="3.5" fill="#1f2937"/>
    <circle cx="119" cy="100" r="3.5" fill="#1f2937"/>
    <!-- smile -->
    <path d="M88 126c8 6 16 6 24 0" fill="#fff" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
